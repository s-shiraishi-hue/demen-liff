<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>業務管理</title>
<link rel="apple-touch-icon" href="icon-gyomu-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-gyomu-512.png">
<meta name="apple-mobile-web-app-title" content="業務管理">
<link rel="manifest" href="gyomu.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070F2E">
<script>
// 11/26 職人が LINE で URL を受け取って押したとき：LINE の中のブラウザだとホーム画面に追加できないので、外のブラウザ（Safari／Chrome）で開き直す
(function () {
  var ua = navigator.userAgent, q = location.search;
  if (/ Line\//i.test(ua) && !/openExternalBrowser=1|inline=1|liff\./.test(q)) {
    location.replace(location.pathname + (q ? q + '&' : '?') + 'openExternalBrowser=1' + location.hash);
  }
})();
</script>
<script>
// 明るさ：自動（携帯の設定）／ライト／ダーク。読み込む前に決めて、白く光るのを防ぐ（人員配置の画面と同じ覚え方）
(function () { var t = null; try { t = localStorage.getItem('iriguchi-theme'); } catch (e) {} if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Inter:wght@500;600;800&family=Cormorant+Garamond:wght@500&display=swap">
<style>
  /* 入口（2026-11-26 決定：Apple風。上は会社のホームページのような紺の帯に英字の社名と小さく「業務管理」、下は iPhone のホーム画面のようなアイコン）
     ライト・ダークは携帯の設定どおり。字は Inter（英数字）＋Noto Sans JP（日本語。11/26 白石さんが D を選んだ） */
  :root{
    /* 11/26 白石さん「もうダークでいいよ下も」：地図の夜空とつながる紺に */
    /* 11/26 夜 白石さん「K でいこう」：下は白地に黒い細線（白黒の線） */
    --bg:#FAFAF8; --ink:#111111; --ink2:#111111; --sub:rgba(17,17,17,.5); --sep:#111111; --wg1:transparent; --wg2:transparent; --field:#FFFFFF; --navy:#070F2E;
    color-scheme:light;
  }
  html{background:var(--bg)}   /* 引っぱったときも同じ紺（11/26） */
  html,body{margin:0;min-height:100%;-webkit-text-size-adjust:100%}
  body{font-family:"Inter","Noto Sans JP","Hiragino Sans",sans-serif;font-feature-settings:"palt";-webkit-font-smoothing:antialiased;color:var(--ink);
    background:radial-gradient(80% 40% at 0% 22%,var(--wg1),transparent 70%),radial-gradient(70% 40% at 100% 40%,var(--wg2),transparent 70%),var(--bg);min-height:100vh}
  a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:520px;margin:0 auto}

  /* 上の帯：紺のグラデーション＋屋根の波板のような細い縦線＋右下の光 */
  .hero{position:relative;color:#fff;overflow:hidden;background:linear-gradient(180deg,#0B1A48 0%,#0F2360 30%,#163A98 75%,#1D4CB4 100%);
    padding:calc(env(safe-area-inset-top,0px) + 30px) max(24px,env(safe-area-inset-right,0px)) 28px max(24px,env(safe-area-inset-left,0px))}
  /* 縦線は上を消して下から右へうっすら（上がぼやけて見えないように 11/26） */
  .hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,rgba(255,255,255,0) 1px 12px);
    -webkit-mask-image:linear-gradient(to bottom,transparent 0%,transparent 35%,#000 100%);mask-image:linear-gradient(to bottom,transparent 0%,transparent 35%,#000 100%)}
  .hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(90,160,255,.45),rgba(90,160,255,0) 70%)}
  .hero .wrap{position:relative;z-index:1}
  /* 上は小さく英字の社名、タイトルは「業務管理」を小さめに（11/26） */
  .hero .en{font:600 11px/1 "Inter",sans-serif;letter-spacing:.3em;opacity:.75}
  .hero h1{margin:0;font:700 24px/1.1 "Noto Sans JP",sans-serif;letter-spacing:.08em}   /* 業務管理ははっきり（11/26「見えないから」） */
  .hero .dt{margin-top:8px;font:500 12px/1 "Inter","Noto Sans JP",sans-serif;opacity:.75;letter-spacing:.04em;font-variant-numeric:tabular-nums}
  .hero .test{display:inline-block;margin-left:8px;font:700 9px/1 "Inter",sans-serif;letter-spacing:.1em;border:1px solid rgba(255,255,255,.6);border-radius:4px;padding:2px 4px;vertical-align:2px;opacity:.9}
  .hero{animation:heroin .6s ease both}
  @keyframes heroin{from{opacity:0}to{opacity:1}}

  /* 下に送ると上に出る小さいタイトル（すりガラス） */
  .bar{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 10px;text-align:center;font:600 15px/1.2 "Inter",sans-serif;letter-spacing:.04em;color:var(--ink);
    background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border-bottom:.5px solid var(--sep);opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s;pointer-events:none}
  .bar.on{opacity:1;transform:none}
  .bar{display:none!important}   /* 11/26 夜 下に送ると上に白いすりガラスの帯が出て、地図が曇って見えた → ロゴがあるので帯は出さない */

  /* アイコン：iPhone のホーム画面と同じ並び。グループは見出しと細い線だけ */
  main{padding:14px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(20px,env(safe-area-inset-left,0px))}
  .grp{padding:2px 0 12px;margin-bottom:10px;border-bottom:1px solid var(--sep)}   /* 区切りの線を少し濃く（11/26） */
  .grp:last-child{border-bottom:0}
  .grp h2{margin:0 2px 9px;font-size:15px;font-weight:700;color:var(--ink2);letter-spacing:.06em}   /* 現場・加工・その他を大きく（11/26） */
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));row-gap:12px;margin:0 -4px}   /* 11/26 その他まで1画面に入るよう詰めた */
  .app{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--ink);text-decoration:none;cursor:pointer}
  .tile{position:relative;width:62px;height:62px;transition:transform .35s cubic-bezier(.2,.9,.25,1.25)}
  .tile svg.sh{position:absolute;inset:0;filter:drop-shadow(0 4px 8px rgba(16,32,96,.16))}
  .tile::before{content:"";position:absolute;inset:1px;border-radius:30%;-webkit-backdrop-filter:blur(10px) saturate(1.6);backdrop-filter:blur(10px) saturate(1.6)}
  .tile svg.gl{position:absolute;inset:0;margin:auto}
  .app:active .tile{transform:scale(.88);transition-duration:.08s}
  .lb{font-size:12px;font-weight:700;white-space:nowrap}
  .app.soon{cursor:default}
  .app.soon .tile{filter:saturate(0) brightness(1.15);opacity:.4}
  .app.soon .lb{color:var(--sub)}
  .cs{margin-top:-4px;font:600 9.5px/1.2 "Inter",sans-serif;color:var(--sub);letter-spacing:.04em}
  .addhint{font-size:12px;line-height:1.7;color:var(--sub);margin:6px 2px 0}

  /* 開いたときの動き（上から順にふわっと） */
  .in{opacity:0;transform:translateY(12px);animation:up .55s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes up{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){ .in,.hero{animation:none;opacity:1;transform:none} .tile{transition:none} }

  /* 合言葉（最初の1回だけ） */
  .gform{max-width:320px;margin:9vh auto 0;text-align:center;padding:0 20px}
  .gform h2{font-size:18px;margin:0 0 6px}
  .gform p{font-size:13px;color:var(--sub);line-height:1.7;margin:0 0 16px}
  .gform input{width:100%;box-sizing:border-box;font:600 26px/1 "Inter",sans-serif;letter-spacing:.4em;text-align:center;padding:12px;border:1px solid var(--sep);border-radius:14px;background:var(--field);color:var(--ink)}
  .gform button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;background:#111;letter-spacing:.2em;color:#fff;font:700 16px/1 inherit;font-family:inherit;cursor:pointer}
  .gerr{color:#FF453A;font-size:13px;min-height:1.6em;margin-top:8px}
  /* ライトでは白い地に溶けて薄く見えるので、色を透かさずはっきり出す。Coming soon は薄いまま（11/26） */
  /* ライトだけで使う（11/26）：アイコンは透かさずはっきり、Coming soon は薄く */
  .tile svg.sh .b{stop-opacity:1}
  .tile svg.sh{filter:drop-shadow(0 4px 10px rgba(16,32,96,.22))}
  .app.soon .tile{filter:saturate(0);opacity:.3}
  /* 明るさの切り替え（帯の右上、すりガラス） */
  /* 帯（11/26 見本どおり）：左に業務管理と日付、右に天気。2行の高さをそろえ、間に細い縦線 */
  .hgrid{display:grid;grid-template-columns:auto auto;justify-content:space-between;align-items:center;column-gap:20px;padding:0 10px}
  .hero h1{grid-column:1;grid-row:1;align-self:end;font-size:26px}
  .hero .dt{grid-column:1;grid-row:2;align-self:start;margin:0;padding-top:10px;opacity:.85}
  .wtop,.wsub{grid-column:2;justify-self:stretch;padding-left:18px;border-left:1px solid rgba(255,255,255,.22);color:#fff;display:flex;align-items:center}
  .wtop{grid-row:1;align-self:end;justify-content:center;gap:8px;opacity:.9;font:600 24px/1.1 "Inter",sans-serif;letter-spacing:-.01em}
  .wsub{grid-row:2;align-self:start;padding-top:10px;gap:4px;opacity:.75;font:500 12px/1 "Inter","Noto Sans JP",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
  .wsub .dot{opacity:.6}
  /* ===== 上の地図（11/26 白石さん：上3分の1を地図だけ、写真で固定、地名を入れる、ライトだけ） ===== */
  .hero.map{height:36vh;min-height:220px;max-height:360px;padding:0;background:#0B1A48;overflow:hidden;position:relative;animation:none}
  .hero.map::before{z-index:2;background:linear-gradient(180deg,rgba(7,12,31,.5) 0%,rgba(7,12,31,0) 26%,rgba(7,12,31,0) 72%,var(--bg) 100%);-webkit-mask-image:none;mask-image:none;pointer-events:none}
  .hero.map::after{display:none}
  #tiles{position:absolute;left:0;top:0;transform-origin:0 0}
  #tiles img{position:absolute;width:256px;height:256px;display:block}
  #labels,#pins{position:absolute;inset:0;z-index:3;pointer-events:none}
  .area{position:absolute;transform:translate(-50%,-50%);color:#fff;font:700 12px/1 "Noto Sans JP",sans-serif;letter-spacing:.24em;text-shadow:0 1px 4px rgba(0,0,0,.7);white-space:nowrap}
  .area.big{font-size:15px}
  .pin{position:absolute;transform:translate(-50%,calc(-100% - 6px));display:flex;align-items:center;gap:6px;padding:5px 6px 5px 9px;border-radius:999px;background:rgba(255,206,64,.96);color:#1A1A1A;font:700 11px/1 "Noto Sans JP",sans-serif;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.35)}
  .pin b{font:700 10.5px/1 "Inter",sans-serif;background:#14192B;color:#fff;border-radius:999px;padding:3px 6px}
  .pin::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:rgba(255,206,64,.96);border-bottom:0}
  .dotp{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#FFCE40;box-shadow:0 0 0 3px rgba(255,206,64,.35)}
  .credit{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:4;font-size:9px;color:rgba(255,255,255,.75)}
  /* 明るさの切り替え：帯のすぐ下の右上 */
  .tb{display:flex;justify-content:flex-end;margin-top:-14px;margin-bottom:8px;width:100%;box-sizing:border-box;align-self:stretch}   /* 右上に寄せる（真ん中に出ていたのを直す 11/26） */
  .seg{display:flex;padding:2px;border-radius:10px;background:var(--sep)}
  .seg button{border:0;background:transparent;color:var(--sub);font:600 11px/1 "Inter","Noto Sans JP",sans-serif;min-width:30px;height:26px;padding:0 8px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .seg button[aria-checked="true"]{background:var(--field);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  /* アイコンは画面の下のほうにそろえる（親指の届く高さ）。多いときは上から並ぶ */
  body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  main{flex:1;display:flex;flex-direction:column}
  #menu{margin-top:auto;width:100%}
  .gform{margin-top:6vh}
  [hidden]{display:none!important}
  /* はじめの案内（11/26） */
  .setup{max-width:340px;margin:5vh auto 0;padding:0 22px 24px}
  .st-en{margin:0 0 10px;font:600 10px/1 "Inter",sans-serif;letter-spacing:.34em;color:rgba(17,17,17,.5)}
  .setup h2{margin:0 0 8px;font:700 19px/1.5 "Noto Sans JP",sans-serif;color:#111}
  .st-lead{margin:0 0 18px;font-size:13px;line-height:1.7;color:rgba(17,17,17,.6)}
  .st-steps{list-style:none;margin:0;padding:0;border-top:1px solid #111}
  .st-steps li{display:flex;gap:14px;align-items:flex-start;padding:14px 2px;border-bottom:1px solid #E2E2E2;font-size:14px;line-height:1.6;color:#111}
  .st-steps li b{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid #111;display:grid;place-items:center;font:600 12px/1 "Inter",sans-serif}
  .st-steps li small{display:block;font-size:11.5px;color:rgba(17,17,17,.55)}
  .st-steps .ic{display:inline-block;vertical-align:-3px;width:16px;height:16px;stroke:#111;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .st-note{margin:16px 0 0;font-size:12.5px;line-height:1.7;color:rgba(17,17,17,.6)}
  .st-skip{display:block;margin:22px auto 0;border:0;background:none;font:500 12px/1 "Noto Sans JP",sans-serif;color:rgba(17,17,17,.5);text-decoration:underline;cursor:pointer}
  #going{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#FAFAF8;opacity:0;pointer-events:none;transition:opacity .18s}
  #going.on{opacity:1;pointer-events:auto}
  #going i{width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(17,17,17,.15);border-top-color:#111;animation:gospin .8s linear infinite}
  #going span{font:500 12px/1 'Noto Sans JP',sans-serif;letter-spacing:.24em;color:#111}
  @keyframes gospin{to{transform:rotate(360deg)}}
  /* ===== K：白黒の線（11/26 夜 決定） ===== */
  body{background:var(--bg)}
  #menu .grp{padding:14px 0 16px;margin:0;border-bottom:0;border-top:1px solid #111}
  #menu .grp:first-child{border-top:0;padding-top:4px}
  #menu .grp h2{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 14px;font:600 10.5px/1 "Inter",sans-serif;letter-spacing:.34em;color:#111}
  #menu .grp h2 span{font:500 10.5px/1 "Noto Sans JP",sans-serif;letter-spacing:.24em;color:rgba(17,17,17,.55)}
  #menu .grid{row-gap:16px}
  #menu .app{gap:8px}
  #menu .tile{width:58px;height:58px;border-radius:50%;border:1px solid #111;background:#fff;box-sizing:border-box}
  #menu .tile::before,#menu .tile svg.sh{display:none}
  #menu .tile svg.gl{width:26px;height:26px;stroke:#111;stroke-width:1.4}
  #menu .app:active .tile{background:#111}
  #menu .app:active .tile svg.gl{stroke:#fff}
  #menu .lb{font:500 11.5px/1 "Noto Sans JP",sans-serif;letter-spacing:.12em;color:#111}
  #menu .en{margin-top:-3px;font:600 7.5px/1 "Inter",sans-serif;letter-spacing:.22em;color:rgba(17,17,17,.45)}
  #menu .app.soon .tile,#menu .app.soon .lb,#menu .app.soon .en{opacity:.3;filter:none}
  #menu .app.soon .cs{display:none}
  .addhint{color:rgba(17,17,17,.5)}
  /* 地図の左上のロゴ（11/26 D-9：細い飾りつきの字・透ける） */
  .brand{position:absolute;z-index:3;left:18px;top:calc(env(safe-area-inset-top,0px) + 16px);pointer-events:none;color:#fff}
  .brand::before{content:"";display:block;width:20px;height:2px;margin-bottom:7px;border-radius:2px;background:rgba(255,212,61,.75);box-shadow:0 0 10px rgba(255,212,61,.45)}
  .brand b{display:block;font:500 15px/1 'Cormorant Garamond',serif;letter-spacing:.4em;color:rgba(255,255,255,.62);text-shadow:0 0 18px rgba(255,255,255,.25);mix-blend-mode:screen}
  .brand small{display:block;margin-top:5px;font:500 8px/1 'Noto Sans JP',sans-serif;letter-spacing:.34em;color:rgba(255,255,255,.5)}
  /* ===== 立体の地図（11/26 PC の業務管理と同じ作り。three.js＋m3d.js） ===== */
  .hero.map.is-3d{height:30vh;min-height:200px;max-height:300px;background:#070f2e}   /* 11/26 前の7割くらい */
  /* 11/26 夜 上が白く曇って見えた（地図の遠くのかすみが時計の帯の下に出る）→ 上の帯だけ夜空の紺でしめる。ピンにはかからない高さ */
  .hero.map.is-3d::before{display:block;content:"";position:absolute;left:0;right:0;top:0;bottom:auto;height:calc(env(safe-area-inset-top,0px) + 70px);z-index:2;background:linear-gradient(180deg,rgba(7,15,46,.92) 0%,rgba(7,15,46,.7) 45%,rgba(7,15,46,0) 100%);pointer-events:none}   /* 11/26 ピンが暗くならないように（地図の上はもともと夜空） */
  .m3-stage{position:absolute;inset:0;z-index:1;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  .m3-stage .h-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .m3-plane{position:absolute;inset:0;pointer-events:none}
  .m3-plane .h-town i{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-style:normal}
  .m3-plane .h-town{position:absolute;left:0;top:0;width:0;height:0;font:700 11px/1 "Noto Sans JP",sans-serif;letter-spacing:.22em;white-space:nowrap;color:#eef3ff;text-shadow:0 1px 4px rgba(5,12,40,.95),0 0 2px rgba(5,12,40,.95)}
  .m3-plane .h-town.big{font-size:14px;letter-spacing:.28em}
  .m3-plane .h-pin{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
  .h-pin-stem{position:absolute;bottom:0;left:-1px;width:2px;height:var(--h);background:linear-gradient(180deg,#fff,rgba(255,255,255,.45));pointer-events:none}
  .h-pin-head{position:absolute;bottom:var(--h);left:var(--dx,0);display:flex;align-items:center;gap:6px;width:max-content;max-width:9.5rem;height:26px;padding:0 4px 0 10px;transform:translate(-50%,0);border-radius:999px;background:#ffd43d;color:#16204a;font:700 11px/1 "Noto Sans JP",sans-serif;white-space:nowrap;box-shadow:0 6px 16px rgba(4,9,32,.55),0 0 0 2px #fff}
  .h-pin.is-today .h-pin-head b::before{content:"";display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:50%;background:var(--co,#16204a);box-shadow:0 0 0 1.5px #16204a;vertical-align:.02em}   /* 11/26 会社の色 */
  .h-pin-head b{min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:700}
  .h-pin-head em{flex:none;padding:3px 7px;border-radius:999px;background:#16204a;color:#fff;font:600 12px/1 "Inter",sans-serif;font-style:normal}
  .h-pin.is-other .h-pin-head{width:9px;height:9px;padding:0;gap:0;border-radius:50%;background:var(--co,#9cc3ff);box-shadow:0 0 0 1.5px #fff}
  .h-pin.is-other .h-pin-stem{opacity:.7}
  .h-pin-name{position:absolute;bottom:calc(var(--h) + 13px);left:0;transform:translateX(-50%);padding:1px 6px;border-left:3px solid var(--co,#9cc3ff);border-radius:3px;background:rgba(8,14,38,.66);color:#e6ecff;font:500 10px/1.5 "Noto Sans JP",sans-serif;white-space:nowrap}

function mx(lon,z){ return (lon+180)/360*Math.pow(2,z)*256; }

  var cx = mx(MAPV.lon,z), cy = my(MAPV.lat,z), left = cx - W/s/2, top = cy - H/s/2;
  var tiles = document.getElementById('tiles'), h = '';
  for (var tx=Math.floor(left/256); tx<=Math.floor((left+W/s)/256); tx++) for (var ty=Math.floor(top/256); ty<=Math.floor((top+H/s)/256); ty++)

var openPin = null, PIN_LIST = [];
var CO_NAME = { sh: '白石工業', nk: '中嶋板金工業', ym: '山下板金工作所', kakou: '加工' };
function closeCard(){ var c = document.getElementById('m3card'); if (c) c.hidden = true; if (openPin) openPin.classList.remove('is-open'); openPin = null; }
function showCard(el){
  var p = PIN_LIST[Number(el.dataset.pin)]; if (!p) return;
  if (openPin) openPin.classList.remove('is-open');
  openPin = el; el.classList.add('is-open');
  var esc = function(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); };
  var c = document.getElementById('m3card');
  c.className = 'm3-card co-' + (p.own || 'sh');
  var tags = p.other ? '<span>' + esc(p.st || '工事中') + '</span>' : '<span class="today">今日 ' + (p.n || 0) + '人</span>';
  c.innerHTML = '<button type="button" class="x" aria-label="閉じる">×</button><h3>' + esc(p.name) + '</h3>' + (p.title && p.title !== p.name ? '<p style="margin:-2px 0 2px;font:500 12px/1.4 Noto Sans JP,sans-serif;color:#5A6385">' + esc(p.title) + '</p>' : '')
    + '<div class="row">' + tags + '<span>' + (CO_NAME[p.own] || '') + '</span></div>'
    + (p.mem && p.mem.length ? '<div class="mem">' + p.mem.map(function(m, k){ return '<span' + (k === 0 ? ' class="lead"' : '') + '>' + esc(m) + '</span>'; }).join('') + '</div>' : '')
    + '<div class="go"><a href="' + String(/^https:\/\//.test(p.url || '') ? p.url : 'https://www.google.com/maps/search/?api=1&query=' + p.lat + ',' + p.lon).replace(/["<>]/g, encodeURIComponent) + '" target="_blank" rel="noopener">地図で開く</a>'
    + (p.other ? '' : '<a class="sub" href="haichi-view-test.html">人員配置を見る</a>') + '</div>';
  c.hidden = false;
  c.querySelector('.x').onclick = function(e){ e.stopPropagation(); closeCard(); };
}
function mapStart(){
  if (window.Map3D && window.Map3D.supported()) {
    document.getElementById('map').classList.add('is-3d');
    document.getElementById('m3stage').hidden = false;
    document.getElementById('tiles').hidden = true; document.getElementById('labels').hidden = true; document.getElementById('pins').hidden = true;
    draw3d();
    document.addEventListener('click', function(e){   // 11/26 カードの外（アイコンのところも）を押したら閉じる
      if (openPin && !e.target.closest('#m3card') && !e.target.closest('[data-pin]')) { closeCard(); if (!e.target.closest('#m3stage')) { e.preventDefault(); e.stopPropagation(); } }   // 閉じるだけで、アイコンは開かない
    }, true);
    document.getElementById('m3stage').addEventListener('click', function(e){
      var el = e.target.closest('[data-pin]');
      if (el) { if (openPin === el) closeCard(); else showCard(el); return; }
      if (!e.target.closest('#m3card')) closeCard();
    });
    var vb = document.getElementById('m3views'); vb.hidden = false;
    vb.addEventListener('click', function(e){
      var b = e.target.closest('button'); if (!b || !M3) return;
      if (b.dataset.orbit) { orbiting = !orbiting; b.classList.toggle('on', orbiting); b.setAttribute('aria-pressed', String(orbiting)); M3.orbit(orbiting); return; }
      vb.querySelectorAll('[data-view]').forEach(function(x){ x.classList.toggle('on', x === b); });
      M3.flyTo(b.dataset.view);
    });
  } else { drawMap(); window.addEventListener('resize', drawMap); }
}
if (window.Map3D) mapStart(); else document.addEventListener('DOMContentLoaded', mapStart);   // 地図の部品は後から読む（アイコンを先に出す）

// 下に送ったら上に小さいタイトル
window.addEventListener('scroll', function(){ document.getElementById('bar').classList.toggle('on', window.scrollY > 80); }, { passive:true });

// 出面・現調：LINE の中ならそのままフォームへ。外（Safari・ホーム画面）なら LINE アプリを開いて ?to= で渡す
function showGoing(){
  var g = document.getElementById('going');
  if (!g) { g = document.createElement('div'); g.id = 'going'; g.innerHTML = '<i></i><span>LINE を開いています</span>'; document.body.appendChild(g); }
  g.className = 'on';
}
// LINE から戻ってきたら消す
window.addEventListener('pageshow', function(){ var g = document.getElementById('going'); if (g) g.className = ''; });
document.addEventListener('visibilitychange', function(){ if (!document.hidden) setTimeout(function(){ var g = document.getElementById('going'); if (g) g.className = ''; }, 600); });
function goLine(to) {
  showGoing();   // 11/26 押した瞬間に「LINE を開いています」を出して、切り替わりを目立たなくする
  if (inLine) { location.href = LOCAL[to]; return; }
  // line:// で開くと LINE が ?to= を落として出面が開いた（11/26）。行き先が残る https://liff.line.me/ の形だけで開く
  location.href = 'https://liff.line.me/' + LIFF + '?to=' + to;
}
document.getElementById('groups').addEventListener('click', function (e) {
  var d = e.target.closest('a[data-dyn]');
  if (d){ e.preventDefault(); openDyn(d.dataset.dyn); return; }
  var a = e.target.closest('a[data-line]'); if (!a) return;
  e.preventDefault(); goLine(a.dataset.line);
});
if (inLine) { var ls = document.createElement('script'); ls.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js'; ls.onload = function(){ liff.init({ liffId: LIFF }).catch(function () {}); }; document.head.appendChild(ls); }   // 11/26 LINE の中のときだけ読む

// ホーム画面のアイコンにしていないとき（Safari でふつうに開いたとき）は、下に追加のしかたを出す
if (!inLine && !standalone) {
  var h = document.getElementById('addhint');
  h.hidden = false;
  h.innerHTML = (/iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1))
    ? 'ホーム画面のアイコンにすると、次からすぐ開けます。<br>共有ボタン（□↑）→「ホーム画面に追加」。見えないときは右下の … から「共有」'
    : 'ホーム画面のアイコンにすると、次からすぐ開けます。<br>右上の ⋮ →「ホーム画面に追加」';
}

// ===== 合言葉で受け取るつなぎ先（加工管理など。GitHub のページには書かない） =====
var LINKS = {}; try { LINKS = JSON.parse(localStorage.getItem('gyomu-links') || '{}') || {}; } catch(e){}
function loadLinks(){
  if (!getPass()) return Promise.resolve({});   // 合言葉が無いときは問い合わせない（間違いの回数に数えられないように）
  return fetch(CHECK_API + '?check=1&p=' + encodeURIComponent(getPass())).then(function(r){ return r.json(); }).then(function(j){
    if (j.bad) { setPass(''); askPass('合言葉が変わりました。もう一度入れてください'); return j; }
    if (j.ok && j.links){ LINKS = j.links; try { localStorage.setItem('gyomu-links', JSON.stringify(LINKS)); } catch(e){} }
    return j;
  });
}
// 加工管理は外の Safari で開く（11/26：同じ画面で開くと、加工の依頼を LINE に送ったときに入口ごと閉じて戻れなかった）
// 11/26 点検③：開けなかったときに同じ画面で開くと、加工のページから入口に戻れなくなる → 同じ画面では開かず、知らせるだけにする
function openOut(u){ var w = null; try { w = window.open(u, '_blank'); } catch(e){} if (!w) toast('開けませんでした。もう一度押してください'); }
function openDyn(k){
  if (LINKS[k]) { openOut(LINKS[k]); return; }
  // つなぎ先をまだ受け取っていない（電波が弱いなど）。空の窓は開かずに、受け取ってから押し直してもらう
  toast('準備しています…少し待ってもう一度押してください');
  loadLinks().then(function(){ toast(LINKS[k] ? '準備できました。もう一度押してください' : 'つなぎ先を受け取れませんでした。電波のよい所で開き直してください'); })
    .catch(function(){ toast('つなぎ先を受け取れませんでした。電波のよい所で開き直してください'); });
}
var toastT = 0;
function toast(msg){
  var t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.className = 'on'; clearTimeout(toastT); toastT = setTimeout(function(){ t.className = ''; }, 3500);
}

// ===== 合言葉（1回入れて携帯が覚える。確かめは人員配置の読み取りの仕組みで） =====
function getPass(){ try { return localStorage.getItem(PASS_KEY) || ''; } catch(e){ return ''; } }
function setPass(v){ try { if (v) localStorage.setItem(PASS_KEY, v); else localStorage.removeItem(PASS_KEY); } catch(e){} }
function showMenu(){ document.getElementById('gform').hidden = true; document.getElementById('menu').hidden = false; loadLinks().catch(function(){}); loadPins(); }
function askPass(err){
  document.getElementById('menu').hidden = true; document.getElementById('gform').hidden = false;
  document.getElementById('gerr').textContent = err || '';
  setTimeout(function(){ document.getElementById('gin').focus(); }, 50);
}
document.getElementById('gform').onsubmit = function(e){
  e.preventDefault();
  var v = document.getElementById('gin').value.trim(), btn = document.getElementById('gbtn');
  if (!v) return;
  btn.disabled = true; btn.textContent = '確かめています…';
  fetch(CHECK_API + '?check=1&p=' + encodeURIComponent(v)).then(function(r){ return r.json(); }).then(function(j){
    btn.disabled = false; btn.textContent = '開く';
    if (j.ok){ setPass(v); showMenu(); }
    else document.getElementById('gerr').textContent = j.error || '合言葉が違います';
  }).catch(function(){ btn.disabled = false; btn.textContent = '開く'; document.getElementById('gerr').textContent = 'つながりませんでした。電波のよいところでもう一度'; });
};
// 11/26 はじめの案内：ホーム画面のアイコンから開いていない携帯で、まだ合言葉がない人には先に案内を出す
// （iPhone は Safari とアイコンで覚える場所が別なので、Safari で合言葉を入れても、アイコンから開くともう一度聞かれる。先に案内すれば合言葉は1回で済む）
var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
var isAndroid = /Android/.test(navigator.userAgent);
var skipSetup = false; try { skipSetup = sessionStorage.getItem('gyomu-skip-setup') === '1'; } catch (e) {}
function showSetup(){
  var steps = inLine
    ? ['右下（または右上）の … を押す', '「Safari で開く」（Android は「ブラウザで開く」）を押す', '開いた画面で、もう一度この案内にしたがってアイコンを作る']
    : isIOS
    ? (/CriOS/.test(navigator.userAgent)
        ? ['右上（または下）の <svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M6 11H5v10h14V11h-1"/></svg> 共有ボタンを押す', '「ホーム画面に追加」を押す<small>見当たらないときは、一覧を下へずらす</small>', '右上の「追加」を押す', 'ホーム画面にできた<b style="all:unset;font-weight:700">「業務管理」</b>のアイコンから開く']
        : ['画面の下の <svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M6 11H5v10h14V11h-1"/></svg> 共有ボタンを押す<small>ボタンが見えないときは、右下の <svg class="ic" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg> を押してから「共有」</small>', '「ホーム画面に追加」を押す<small>見当たらないときは、一覧を下へずらす</small>', '右上の「追加」を押す', 'ホーム画面にできた<b style="all:unset;font-weight:700">「業務管理」</b>のアイコンから開く'])
    : ['右上の <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/></svg> を押す', '「ホーム画面に追加」または「アプリをインストール」を押す', '「追加」（または「インストール」）を押す', 'ホーム画面にできた<b style="all:unset;font-weight:700">「業務管理」</b>のアイコンから開く'];
  document.getElementById('st-steps').innerHTML = steps.map(function(t, i){ return '<li><b>' + (i + 1) + '</b><span>' + t + '</span></li>'; }).join('');
  document.getElementById('setup').hidden = false;
  document.getElementById('gform').hidden = true;
  document.getElementById('menu').hidden = true;
}
document.getElementById('st-skip').onclick = function(){
  try { sessionStorage.setItem('gyomu-skip-setup', '1'); } catch (e) {}
  document.getElementById('setup').hidden = true;
  askPass('');
};
if (getPass()) showMenu();
else if (!standalone && (isIOS || isAndroid || inLine) && !skipSetup) showSetup();
else askPass('');
</script>
<script>
// 新しい版があれば自動で読み直す（11/26：ホーム画面のアイコンが前の画面を出し続けるため）。数字は上げるたびに変える
var BUILD_ID = "20261126-31";
(function(){
  function check(){
    fetch(location.pathname + "?bust=" + Date.now(), { cache: "no-store" }).then(function(r){ return r.text(); }).then(function(t){
      var m = /BUILD_ID = "([^"]+)"/.exec(t);
      if (m && m[1] !== BUILD_ID) { var q = location.search.replace(/([?&])v=[^&]*&?/, "$1").replace(/[?&]$/, ""); location.replace(location.pathname + (q ? q + "&" : "?") + "v=" + m[1] + location.hash); }
    }).catch(function(){});
  }
  check();
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) check(); });   // アプリに戻ったときも
})();
</script>
</body>
