<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>業務管理テスト</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="業務管理テスト">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<script>
// 明るさ：自動（携帯の設定どおり）／ライト／ダーク。読み込む前に決めて、白く光るのを防ぐ
(function () { var t = null; try { t = localStorage.getItem('iriguchi-theme'); } catch (e) {} if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); })();
</script>
<style>
  /* 入口（2026-11-26 決定：G＝PC の業務管理とそろえた形＋上の帯と見出し。青は A くらいに抑える） */
  :root{
    --ground:#FFFFFF; --ink:#111318; --sub:#7C808A; --hair:rgba(60,60,67,.12); --line:#D5D9E0;
    --band:#1E3C8F; --band-ink:#FFFFFF; --tile:#1E3C8F; --head-bg:#EEF1F7; --soon:#9AA0AA;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --ground:#121316; --ink:#F4F5F7; --sub:#8D919B; --hair:rgba(84,84,88,.45); --line:#33363D;
    --band:#26386B; --band-ink:#F4F5F7; --tile:#26386B; --head-bg:#1F2A48; --soon:#4A4E57; color-scheme:dark } }
  :root[data-theme="dark"]{
    --ground:#121316; --ink:#F4F5F7; --sub:#8D919B; --hair:rgba(84,84,88,.45); --line:#33363D;
    --band:#26386B; --band-ink:#F4F5F7; --tile:#26386B; --head-bg:#1F2A48; --soon:#4A4E57; color-scheme:dark }

  html,body{margin:0;min-height:100%;-webkit-text-size-adjust:100%}
  body{background:var(--ground);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif;font-feature-settings:"palt";-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
  .wrap{max-width:480px;margin:0 auto}

  /* 上の帯 */
  .band{background:var(--band);color:var(--band-ink);padding:calc(env(safe-area-inset-top,0px) + 10px) max(18px,env(safe-area-inset-right,0px)) 11px max(18px,env(safe-area-inset-left,0px))}
  .band-in{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:10px}
  .mark{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.12em;opacity:.85}
  .title{font-size:17px;font-weight:700;letter-spacing:.06em}
  .date{flex-basis:100%;font-size:11px;opacity:.75;margin-top:2px;font-variant-numeric:tabular-nums}
  .seg{display:flex;padding:2px;border-radius:9px;background:rgba(255,255,255,.16);flex:0 0 auto}
  .seg button{border:0;background:transparent;color:rgba(255,255,255,.8);font:600 11px/1 inherit;font-family:inherit;min-width:32px;height:26px;padding:0 8px;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .seg button[aria-checked="true"]{background:rgba(255,255,255,.95);color:#14264F}

  /* グループ */
  .body{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px))}
  .grp{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
  .grp h2{margin:0;padding:9px 14px;font-size:14px;font-weight:700;background:var(--head-bg);border-bottom:1px solid var(--line);letter-spacing:.1em}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));row-gap:16px;padding:14px 6px 16px}
  .app{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);text-decoration:none;-webkit-tap-highlight-color:transparent;border-radius:10px;outline:none}
  .app:focus-visible .tile{box-shadow:0 0 0 3px var(--ground),0 0 0 5px #4D6BFF}
  .tile{width:56px;height:56px;border-radius:8px;background:var(--tile);display:flex;align-items:center;justify-content:center;transition:transform .2s cubic-bezier(.2,.9,.3,1.3)}
  .app:active .tile{transform:scale(.94);transition-duration:.08s}
  .lb{font-size:12px;font-weight:500;white-space:nowrap;letter-spacing:.02em}
  .app.soon{pointer-events:none}
  .app.soon .tile{background:var(--soon);opacity:.7}
  .app.soon .lb{color:var(--sub)}
  .cs{margin-top:-3px;font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--sub);white-space:nowrap}

  /* LINE の外で開いたとき */
  #outside{text-align:center;padding:12vh 24px 0}
  #outside img{width:84px;height:84px;border-radius:19px}
  #outside h1{font-size:20px;margin:14px 0 6px}
  #outside p{font-size:15px;line-height:1.8;margin:6px 0;color:var(--sub)}
  #outside a{display:block;margin:22px auto 0;max-width:300px;padding:14px;border-radius:10px;background:#06C755;color:#fff;font-weight:700;font-size:16px;text-decoration:none}
  .test{display:inline-block;font-size:10px;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px;opacity:.8;vertical-align:2px}
  /* 合言葉 */
  .gform{max-width:320px;margin:10vh auto 0;text-align:center;padding:0 20px}
  .gform h1{font-size:18px;margin:0 0 6px}
  .gform p{font-size:13px;color:var(--sub);line-height:1.7;margin:0 0 16px}
  .gform input{width:100%;box-sizing:border-box;font-size:24px;letter-spacing:.4em;text-align:center;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--ground);color:var(--ink);-webkit-user-select:text;user-select:text}
  .gform button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:var(--band);color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
  .gerr{color:#D63031;font-size:13px;min-height:1.6em;margin-top:8px}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion: reduce){ .tile{transition:none} .app:active .tile{transform:none} }
</style>
</head>
<body>

<!-- LINE の中で開いたとき -->
<div id="menu" hidden>
  <header class="band"><div class="band-in">
    <div class="brand">
      <span class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 20V9l9-5 9 5v11"/><path d="M8 20v-6h8v6"/></svg>白石グループ</span>
      <span class="title">業務管理<span class="test">テスト</span></span>
      <span class="date" id="date"></span>
    </div>
    <div class="seg" role="radiogroup" aria-label="表示の明るさ">
      <button type="button" data-t="auto" role="radio">自動</button>
      <button type="button" data-t="light" role="radio" aria-label="ライト"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button>
      <button type="button" data-t="dark" role="radio" aria-label="ダーク"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.8 8.8 0 0 1 9.4 3.5a.8.8 0 0 0-1-1A10.5 10.5 0 1 0 21.5 15.6a.8.8 0 0 0-1-1Z"/></svg></button>
    </div>
  </div></header>
  <main class="body"><div class="wrap" id="groups"></div></main>
</div>

<!-- 合言葉（最初の1回だけ） -->
<div id="gate" hidden>
  <header class="band"><div class="band-in"><div class="brand">
    <span class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 20V9l9-5 9 5v11"/><path d="M8 20v-6h8v6"/></svg>白石グループ</span>
    <span class="title">業務管理</span>
  </div></div></header>
  <form id="gform" class="gform">
    <h1>合言葉を入れてください</h1>
    <p>会社から聞いた合言葉です。<br>1回入れると、この携帯が覚えます。</p>
    <input id="gin" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="合言葉">
    <button type="submit" id="gbtn">開く</button>
    <div class="gerr" id="gerr"></div>
  </form>
</div>

<!-- LINE の外（Safari など）で開いたとき：ホーム画面への追加のしかた -->
<div id="outside" hidden>
  <img src="icon-180.png" alt="">
  <h1>業務管理</h1>
  <p id="how-ios" hidden>下の「≡」→「共有」→「ホーム画面に追加」<br>（古い iPhone は共有ボタン □↑ から）<br>アイコンから開くと LINE の中で開きます。</p>
  <p id="how-android" hidden>右上の ⋮ →「ホーム画面に追加」<br>アイコンから開くと LINE の中で開きます。</p>
  <a id="open" href="#">LINE で開く</a>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
var LIFF = '2011897591-HBBipfnN';
var PASS_KEY = 'gyomu-pass';
var CHECK_API = 'https://script.google.com/macros/s/AKfycbz_T9F0l7sHffSRxrU-nSa8dRd954UMMi7Q6veE-dkuzDBS-NIOoOjGOf6J8jR04Mmx/exec';
var PAGE = 'iriguchi-test.html';
// 行き先はアドレスの後ろ（/iriguchi-test.html）ではなく ?to= で渡す。LINE が後ろを落として出面が開いたため（11/26）
var app = 'line://app/' + LIFF + '?to=iriguchi-test';              // LINE アプリを直接開く
var web = 'https://liff.line.me/' + LIFF + '?to=iriguchi-test';    // LINE アプリが開かないときの予備
var inLine = /Line\//i.test(navigator.userAgent) || /[?&]preview=1/.test(location.search);
var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

// 線の絵（24×24）
var GLYPH = {
  dem:'<rect x="5.5" y="4.5" width="13" height="16" rx="2.2"/><path d="M9.5 4.5V3.6c0-.3.3-.6.6-.6h3.8c.3 0 .6.3.6.6v.9"/><path d="M8.8 10.2h6.4M8.8 13.4h6.4M8.8 16.6h3.6"/>',
  gch:'<path d="M3.8 8.6c0-.9.7-1.6 1.6-1.6h2.1l1.3-2h6.4l1.3 2h2.1c.9 0 1.6.7 1.6 1.6v9.2c0 .9-.7 1.6-1.6 1.6H5.4c-.9 0-1.6-.7-1.6-1.6z"/><circle cx="12" cy="13" r="3.4"/>',
  hai:'<circle cx="9" cy="8.2" r="2.9"/><path d="M3.8 19c.5-3 2.6-5 5.2-5s4.7 2 5.2 5"/><circle cx="16.6" cy="9.2" r="2.2"/><path d="M15.6 14.2c2.2.2 3.9 1.8 4.6 4.8"/>',
  kak:'<path d="M14.6 6.4a4 4 0 0 0-5.3 5.3l-5.6 5.6a1.4 1.4 0 0 0 0 2l1 1a1.4 1.4 0 0 0 2 0l5.6-5.6a4 4 0 0 0 5.3-5.3l-2.4 2.4-2.3-.6-.6-2.3z"/>',
  alc:'<path d="M9.2 3.2h5.6M10.2 3.2v5.2l-4.1 8.7a2.1 2.1 0 0 0 1.9 3h8a2.1 2.1 0 0 0 1.9-3l-4.1-8.7V3.2"/><path d="M7.6 14.2h8.8"/>',
  kin:'<circle cx="12" cy="13.2" r="7.6"/><path d="M12 9.4v3.8l2.6 1.7M9.4 2.6h5.2"/>'
};
// 並び（11/26 白石さん）：現場・加工・その他。href の無いものは Coming soon
// 現調・打合せは、出面の Apps Script を直すまでは同じフォームを開く（開いてから「現調・打合せ」を選ぶ）
var GROUPS = [
  { name:'現場', apps:[
    { k:'dem', label:'出面報告',     href:'form-test.html?pick=1' },
    { k:'gch', label:'現調・打合せ', href:'form-test.html?pick=1&mode=gencho' },
    { k:'hai', label:'人員配置',     href:'haichi-view-test.html' }
  ]},
  { name:'加工', apps:[
    { k:'kak', label:'加工依頼' }
  ]},
  { name:'その他', apps:[
    { k:'alc', label:'アルコール' },
    { k:'kin', label:'勤怠' }
  ]}
];
function appHtml(a){
  var t = '<span class="tile"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+GLYPH[a.k]+'</svg></span><span class="lb">'+a.label+'</span>';
  return a.href ? '<a class="app" href="'+a.href+'">'+t+'</a>' : '<span class="app soon" aria-disabled="true">'+t+'<span class="cs">Coming soon</span></span>';
}
document.getElementById('groups').innerHTML = GROUPS.map(function(g){
  return '<section class="grp"><h2>'+g.name+'</h2><div class="grid">'+g.apps.map(appHtml).join('')+'</div></section>';
}).join('');

var d = new Date();
document.getElementById('date').textContent = d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+'日月火水木金土'[d.getDay()]+'）';

// 明るさの切り替え
function setTheme(t){
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  [].forEach.call(document.querySelectorAll('.seg button'), function(b){ b.setAttribute('aria-checked', b.dataset.t === (t || 'auto') ? 'true' : 'false'); });
  try { localStorage.setItem('iriguchi-theme', t || 'auto'); } catch (e) {}
}
document.querySelector('.seg').onclick = function(e){ var b = e.target.closest('button'); if (b) setTheme(b.dataset.t); };
var saved = 'auto'; try { saved = localStorage.getItem('iriguchi-theme') || 'auto'; } catch (e) {}
setTheme(saved);

function goLine() {
  location.href = app;
  setTimeout(function () { if (!document.hidden) location.href = web; }, 1800);
}
if (!inLine) {
  document.getElementById('open').href = web;
  document.getElementById('open').onclick = function (e) { e.preventDefault(); goLine(); };
  if (standalone) {
    goLine();   // ホーム画面のアイコンから開いたら、そのまま LINE へ
  } else {
    document.getElementById('outside').hidden = false;
    document.getElementById(/iPhone|iPad|iPod/.test(navigator.userAgent) ? 'how-ios' : 'how-android').hidden = false;
  }
} else {
  // 名前は出さない（11/26）。LINE の準備だけ先にしておく
  if (window.liff) liff.init({ liffId: LIFF }).catch(function () {});
  if (getPass()) document.getElementById('menu').hidden = false; else askPass('');
}

// ===== 合言葉（11/26：入口で1回入れて携帯が覚える。確かめは人員配置の読み取りの仕組みで） =====
function getPass(){ try { return localStorage.getItem(PASS_KEY) || ''; } catch(e){ return ''; } }
function setPass(v){ try { if (v) localStorage.setItem(PASS_KEY, v); else localStorage.removeItem(PASS_KEY); } catch(e){} }
function askPass(err){
  var g = document.getElementById('gate');
  g.hidden = false; document.getElementById('menu').hidden = true;
  document.getElementById('gerr').textContent = err || '';
  setTimeout(function(){ document.getElementById('gin').focus(); }, 50);
}
document.getElementById('gform').onsubmit = function(e){
  e.preventDefault();
  var v = document.getElementById('gin').value.trim(), btn = document.getElementById('gbtn');
  if (!v) return;
  btn.disabled = true; btn.textContent = '確かめています…';
  fetch(CHECK_API + '?check=1&p=' + encodeURIComponent(v)).then(function(r){ return r.json(); }).then(function(j){
    btn.disabled = false; btn.textContent = '開く';
    if (j.ok){ setPass(v); document.getElementById('gate').hidden = true; document.getElementById('menu').hidden = false; }
    else document.getElementById('gerr').textContent = j.error || '合言葉が違います';
  }).catch(function(){ btn.disabled = false; btn.textContent = '開く'; document.getElementById('gerr').textContent = 'つながりませんでした。電波のよいところでもう一度'; });
};
</script>
</body>
</html>
