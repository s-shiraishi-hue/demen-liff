<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業務報告テスト</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="業務報告テスト">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  html,body{margin:0;min-height:100%;background:#F4F5F7;color:#14264F;font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
  body{padding:24px 16px 32px;box-sizing:border-box}
  .head{display:flex;align-items:center;gap:12px;margin:0 auto 20px;max-width:420px}
  .head img{width:48px;height:48px;border-radius:12px}
  h1{font-size:20px;margin:0}
  .who{font-size:13px;color:#5A6170;margin-top:2px}
  .test{display:inline-block;font-size:11px;font-weight:700;color:#B7410E;border:1px solid #B7410E;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:420px;margin:0 auto}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:130px;padding:16px 8px;box-sizing:border-box;border-radius:14px;background:#fff;border:1px solid #D9DCE2;color:#14264F;text-decoration:none;font-weight:700;font-size:16px;text-align:center;-webkit-tap-highlight-color:transparent}
  .tile:active{background:#E8ECF8}
  .tile .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center}
  .tile small{font-weight:400;font-size:12px;color:#5A6170;line-height:1.4}
  .tile.off{opacity:.45;pointer-events:none}
  .note{max-width:420px;margin:20px auto 0;font-size:13px;line-height:1.7;color:#5A6170}
  #outside{max-width:420px;margin:0 auto;text-align:center}
  #outside p{font-size:16px;line-height:1.8;margin:8px 0;color:#333}
  #outside a{display:block;margin:16px auto 0;max-width:320px;padding:14px;border-radius:8px;background:#0017C1;color:#fff;font-weight:700;text-decoration:none}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="head">
  <img src="icon-180.png" alt="">
  <div><h1>業務報告<span class="test">テスト</span></h1><div class="who" id="who"></div></div>
</div>

<!-- LINEの中で開いたとき：フォームのアイコンを並べる -->
<div id="menu" hidden>
  <div class="grid">
    <a class="tile" href="form-test.html?pick=1">
      <span class="ic" style="background:#0017C1"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>
      出面・現調
      <small>出面（施工）<br>現調・打合せ</small>
    </a>
    <a class="tile off" href="#" aria-disabled="true">
      <span class="ic" style="background:#7A7E86"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></span>
      加工依頼
      <small>準備中</small>
    </a>
  </div>
  <p class="note">入力して送ると、最後にLINEの「送り先を選ぶ」画面が出ます。カードを出したいグループを選んでください。カードはご本人の名前で出ます。</p>
</div>

<!-- LINEの外（Safariなど）で開いたとき：ホーム画面への追加のしかた -->
<div id="outside" hidden>
  <p id="how-ios" hidden>下の共有ボタン → 「ホーム画面に追加」<br>アイコンから開くとLINEの中で開きます。</p>
  <p id="how-android" hidden>右上の ⋮ → 「ホーム画面に追加」<br>アイコンから開くとLINEの中で開きます。</p>
  <a id="open" href="#">LINEで開く</a>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// 入口ページ（2026-11-26 テスト）。ホーム画面のアイコン → LINEの中でこのページ → フォーム → 最後に送り先のグループを選ぶ
var LIFF = '2011897591-HBBipfnN';
var PAGE = 'iriguchi-test.html';
var app = 'line://app/' + LIFF + '/' + PAGE;              // LINEアプリを直接開く
var web = 'https://liff.line.me/' + LIFF + '/' + PAGE;    // LINEアプリが開かないときの予備
var inLine = /Line\//i.test(navigator.userAgent);
var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

function goLine() {
  location.href = app;
  setTimeout(function () { if (!document.hidden) location.href = web; }, 1800);
}

if (!inLine) {
  document.getElementById('open').href = web;
  document.getElementById('open').onclick = function (e) { e.preventDefault(); goLine(); };
  if (standalone) {
    goLine();   // ホーム画面のアイコンから開いたら、そのままLINEへ
  } else {
    document.getElementById('outside').hidden = false;
    document.getElementById(/iPhone|iPad|iPod/.test(navigator.userAgent) ? 'how-ios' : 'how-android').hidden = false;
  }
} else {
  document.getElementById('menu').hidden = false;
  liff.init({ liffId: LIFF }).then(function () {
    return liff.getProfile();
  }).then(function (p) {
    if (p && p.displayName) document.getElementById('who').textContent = p.displayName + ' さん';
  }).catch(function () { /* 名前が出なくても使える */ });
}
</script>
</body>
</html>
