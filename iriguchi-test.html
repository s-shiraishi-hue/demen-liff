<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>業務報告テスト</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="業務報告テスト">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14264F">
<style>
  /* iPhoneのホーム画面に寄せた形（2026-11-26）：壁紙・ウィジェット・角丸のアイコン4列・下に名前 */
  html,body{margin:0;min-height:100%;-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
    color:#fff;
    background:#14264F linear-gradient(160deg,#1E3A8A 0%,#14264F 45%,#0B1430 100%) fixed;
    padding:calc(env(safe-area-inset-top,0px) + 20px) 22px calc(env(safe-area-inset-bottom,0px) + 28px);
    box-sizing:border-box;
    -webkit-user-select:none;user-select:none;
  }
  .wrap{max-width:390px;margin:0 auto}

  /* 上のウィジェット（日付・名前・ひとこと） */
  .widget{
    border-radius:22px;padding:16px 18px;margin-bottom:28px;
    background:rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  }
  .date{font-size:13px;font-weight:600;letter-spacing:.02em;opacity:.85}
  .hello{font-size:22px;font-weight:700;margin-top:4px;line-height:1.3}
  .tip{font-size:13px;line-height:1.6;opacity:.8;margin-top:8px}
  .test{display:inline-block;font-size:11px;font-weight:700;color:#FFD9C2;border:1px solid #FFD9C2;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:3px}

  /* アイコンの並び（iPhoneと同じ4列・約60pxの角丸） */
  .apps{display:flex;flex-wrap:wrap;margin:0 -6px}
  .app{
    width:25%;box-sizing:border-box;padding:0 6px;margin-bottom:22px;
    display:flex;flex-direction:column;align-items:center;
    color:#fff;text-decoration:none;-webkit-tap-highlight-color:transparent;
  }
  .icon{
    width:62px;height:62px;border-radius:15px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
    transition:transform .12s ease;
  }
  .app:active .icon{transform:scale(.9)}
  .label{font-size:12px;margin-top:6px;text-align:center;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.35);white-space:nowrap}
  .app.off{pointer-events:none}
  .app.off .icon{filter:grayscale(1);opacity:.45}
  .app.off .label{opacity:.6}

  /* LINEの外で開いたとき */
  #outside{text-align:center;padding-top:8vh}
  #outside img{width:84px;height:84px;border-radius:19px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  #outside h1{font-size:22px;margin:14px 0 6px}
  #outside p{font-size:15px;line-height:1.8;margin:6px 0;opacity:.9}
  #outside a{display:block;margin:22px auto 0;max-width:300px;padding:14px;border-radius:14px;background:#06C755;color:#fff;font-weight:700;font-size:16px;text-decoration:none}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

<!-- LINEの中で開いたとき：ホーム画面のようにアイコンを並べる -->
<div id="menu" hidden>
  <div class="widget">
    <div class="date" id="date"></div>
    <div class="hello"><span id="who">おつかれさまです</span><span class="test">テスト</span></div>
    <div class="tip">入力して送ると、最後に送り先のグループを選びます。</div>
  </div>

  <div class="apps">
    <a class="app" href="form-test.html?pick=1">
      <span class="icon" style="background:linear-gradient(180deg,#2F6BFF,#0017C1)">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M8.5 10h7M8.5 13.5h7M8.5 17h4"/></svg>
      </span>
      <span class="label">出面・現調</span>
    </a>
    <a class="app off" href="#" aria-disabled="true">
      <span class="icon" style="background:linear-gradient(180deg,#FF9F43,#E8590C)">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3.5 17.5l3 3 5.8-5.8a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
      </span>
      <span class="label">加工依頼</span>
    </a>
  </div>
</div>

<!-- LINEの外（Safariなど）で開いたとき：ホーム画面への追加のしかた -->
<div id="outside" hidden>
  <img src="icon-180.png" alt="">
  <h1>業務報告</h1>
  <p id="how-ios" hidden>下の共有ボタン（□↑）→「ホーム画面に追加」<br>アイコンから開くと LINE の中で開きます。</p>
  <p id="how-android" hidden>右上の ⋮ →「ホーム画面に追加」<br>アイコンから開くと LINE の中で開きます。</p>
  <a id="open" href="#">LINE で開く</a>
</div>

</div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// 入口ページ（2026-11-26 テスト）。ホーム画面のアイコン → LINEの中でこのページ → フォーム → 最後に送り先のグループを選ぶ
var LIFF = '2011897591-HBBipfnN';
var PAGE = 'iriguchi-test.html';
var app = 'line://app/' + LIFF + '/' + PAGE;              // LINEアプリを直接開く
var web = 'https://liff.line.me/' + LIFF + '/' + PAGE;    // LINEアプリが開かないときの予備
var inLine = /Line\//i.test(navigator.userAgent) || /[?&]preview=1/.test(location.search);
var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

function goLine() {
  location.href = app;
  setTimeout(function () { if (!document.hidden) location.href = web; }, 1800);
}

(function () {
  var d = new Date();
  document.getElementById('date').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日（' + '日月火水木金土'[d.getDay()] + '）';
})();

if (!inLine) {
  document.getElementById('open').href = web;
  document.getElementById('open').onclick = function (e) { e.preventDefault(); goLine(); };
  if (standalone) {
    goLine();   // ホーム画面のアイコンから開いたら、そのままLINEへ
  } else {
    document.getElementById('outside').hidden = false;
    document.getElementById(/iPhone|iPad|iPod/.test(navigator.userAgent) ? 'how-ios' : 'how-android').hidden = false;
  }
} else {
  document.getElementById('menu').hidden = false;
  if (window.liff) liff.init({ liffId: LIFF }).then(function () {
    return liff.getProfile();
  }).then(function (p) {
    if (p && p.displayName) document.getElementById('who').textContent = p.displayName + ' さん';
  }).catch(function () { /* 名前が出なくても使える */ });
}
</script>
</body>
</html>
