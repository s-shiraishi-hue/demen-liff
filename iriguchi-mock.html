<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>入口の配置案</title>
<style>
  /* 入口の配置案（2026-11-26・見るだけ。LINEにはつないでいない） */
  html,body{margin:0;min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:#fff;
    background:#14264F linear-gradient(160deg,#1E3A8A 0%,#14264F 45%,#0B1430 100%) fixed;
    padding:20px 22px 130px;box-sizing:border-box;min-height:100vh
  }
  .wrap{max-width:390px;margin:0 auto}
  .widget{border-radius:22px;padding:16px 18px;margin-bottom:24px;background:rgba(255,255,255,.14);backdrop-filter:blur(20px)}
  .date{font-size:13px;font-weight:600;opacity:.85}
  .hello{font-size:22px;font-weight:700;margin-top:4px}
  .today{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.18)}
  .chip.ok{background:rgba(6,199,85,.35)}
  .sec{font-size:12px;font-weight:700;opacity:.7;margin:0 2px 10px;letter-spacing:.05em}
  .apps{display:flex;flex-wrap:wrap;margin:0 -6px 8px}
  .app{width:25%;box-sizing:border-box;padding:0 6px;margin-bottom:20px;display:flex;flex-direction:column;align-items:center;color:#fff;text-decoration:none;position:relative}
  .icon{width:62px;height:62px;border-radius:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .label{font-size:12px;margin-top:6px;text-align:center;line-height:1.25;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .badge{position:absolute;top:-6px;right:2px;font-size:10px;font-weight:700;background:#FF3B30;color:#fff;border-radius:999px;padding:1px 6px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .badge.t{background:#F5A524;color:#3A2600}
  /* 下の固定の段（iPhoneのドック）：毎日使う3つ */
  .dock{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;width:calc(100% - 28px);max-width:370px;box-sizing:border-box;
    border-radius:30px;padding:12px 8px 10px;background:rgba(255,255,255,.2);backdrop-filter:blur(24px);display:flex;justify-content:space-around}
  .dock .app{width:auto;margin:0}
  .dock .label{font-size:11px}
  svg{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="widget">
    <div class="date">11月26日（木）</div>
    <div class="hello">業務報告</div>
    <div class="today"><span class="chip ok">アルコール 済</span><span class="chip">出勤 7:42</span><span class="chip">出面 まだ</span></div>
  </div>

  <div class="sec">依頼・確認</div>
  <div class="apps">
    <a class="app"><span class="icon" style="background:linear-gradient(180deg,#FF9F43,#E8590C)">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3.5 17.5l3 3 5.8-5.8a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
    </span><span class="label">加工依頼</span><span class="badge t">試験</span></a>
    <a class="app"><span class="icon" style="background:linear-gradient(180deg,#34C7B5,#0E8F80)">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.6-3 2.8-5 5.5-5s4.9 2 5.5 5"/><circle cx="17" cy="9" r="2.3"/><path d="M15.8 14.2c2.3.2 4 1.9 4.7 4.8"/></svg>
    </span><span class="label">人員配置</span><span class="badge t">試験</span></a>
    <a class="app"><span class="icon" style="background:linear-gradient(180deg,#8E7CFF,#5B3FD6)">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg>
    </span><span class="label">現場一覧</span></a>
    <a class="app"><span class="icon" style="background:linear-gradient(180deg,#5AC8FA,#1C8BD6)">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 9h6M9 13h6"/></svg>
    </span><span class="label">申請</span></a>
  </div>
</div>

<!-- 下の段：毎日使うもの（朝→夕の順） -->
<div class="dock">
  <a class="app"><span class="icon" style="background:linear-gradient(180deg,#30D158,#13A03B)">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v5l-4 9a2 2 0 0 0 1.8 3h8.4A2 2 0 0 0 18 17l-4-9V3"/><path d="M7.5 14h9"/></svg>
  </span><span class="label">アルコール</span></a>
  <a class="app"><span class="icon" style="background:linear-gradient(180deg,#FF6B6B,#D63031)">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>
  </span><span class="label">勤怠</span></a>
  <a class="app"><span class="icon" style="background:linear-gradient(180deg,#2F6BFF,#0017C1)">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M8.5 10h7M8.5 13.5h7M8.5 17h4"/></svg>
  </span><span class="label">出面・現調</span></a>
</div>
</body>
</html>
