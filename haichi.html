<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>現場配置をLINEに送る</title>
<style>
  body { margin: 0; background: #eef1f0; color: #1d2830; font-family: "BIZ UDPGothic", "Yu Gothic", "Meiryo", sans-serif; line-height: 1.6; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 22px; }
  h1 { margin: 0; font-size: 1.4rem; }
  #bar { padding: 8px 12px; border-radius: 8px; background: #e1f3e7; color: #1f6b3c; font-size: .9rem; }
  #bar.err { background: #fde5e2; color: #b0322a; }
  section { background: #fff; border: 1px solid #d6dddb; border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
  .two { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
  .cvwrap { position: relative; width: 100%; max-width: 560px; }
  canvas { display: block; width: 100%; border: 1px solid #d6dddb; border-radius: 10px; }
  /* 各現場の右上に重ねる［職長 ▾］。画像には写らない */
  .tools { position: absolute; right: 13%; max-width: 62%; display: flex; gap: 4px; align-items: center; }
  select.chief { min-width: 0; max-width: 100%; font: inherit; font-size: 12px; font-weight: 700; color: #7a5b00; background: #fff8e1; border: 1px solid #d99a00; border-radius: 999px; padding: 2px 6px; cursor: pointer; }
  button.memo { flex: none; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #fff; color: #5f6c73; border: 1px solid #c4cdd0; }
  button.memo.on { background: #fff4cc; color: #7a4a00; border-color: #d99a00; }
  .mdl { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .mdl .box { background: #fff; border-radius: 12px; padding: 14px 16px; width: 100%; max-width: 420px; display: grid; gap: 8px; }
  .mdl textarea { font: inherit; font-size: 16px; padding: 8px; border: 1px solid #c4cdd0; border-radius: 8px; resize: vertical; }
  .mdl .row { display: flex; justify-content: flex-end; gap: 8px; }
  .mdl .no { background: #eef1f0; color: #1d2830; }
  pre { margin: 0; background: #f4f6f5; border-radius: 8px; padding: 10px 12px; font-family: inherit; font-size: .9rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  button { font: inherit; font-weight: 700; background: #06a24a; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .st { font-size: .85rem; color: #5f6c73; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="ttl">現場配置をLINEに送る</h1>
  <div id="bar">準備中…</div>
  <div id="list"></div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID = '2011897591-HBBipfnN';
// 人員配置表の Apps Script を「ウェブアプリ」でデプロイしたURL（デプロイしたら入れる）
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwJlG0jp4hniVnIjGjMm2P1VhoPQNwPXFLWn5SxK15cjDer11ZreMdaxzr7tcIOqZFa/exec';

const q = new URLSearchParams(location.search);
// d がないとき（スマホのLINEから開いたとき）は画面で日付を選ぶ
let D = q.get('d'); const K = q.get('k');
let labelShort = '';
const bar = (t, err) => { const b = document.getElementById('bar'); b.textContent = t; b.className = err ? 'err' : ''; };

// ===== 画像を描く（今まで見本で決めた形：現場ごとの箱を2列、会社ごとの色） =====
const COL = { sh: ['#e3edfa', '#1f4f8a'], nk: ['#e1f3e7', '#1f6b3c'], ym: ['#fbe5e3', '#8f3329'], gk: ['#fdf0d9', '#7d5410'], kk: ['#eceae6', '#555049'] };
const FONT = '"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif';
const S = 2, W = 640;  // 2倍で描く

function count(s) { return s.m.reduce((k, p) => k + (p.n || 1), 0); }

// 1枚に3社分：社員は名前（会社の色）、協力会社はA列の会社名と人数「望 ×3」
const CO_LABEL = { sh: '白石工業', nk: '中嶋板金', ym: '山下板金' };
// 職長（2026-10-19）：初めは現場の先頭の人。画像の右上の［職長 ▾］で選び直せる。その場だけ（スプシには書き戻さない）
const CHIEF = {};            // 現場名 → チップの key
const CHIEF_MARK = '職';     // 名前の前の印。'★' にすると星になる
// 現場ごとのメモ（2026-10-19）：送る前に［✎メモ］で入れる。画像の現場の箱の下に入る（地図リンクの文には入れない）。その場だけ
const MEMO = {};             // 現場名 → 文字
// メモを箱の幅で折り返す（改行もそのまま）
function wrapText(ctx, text, maxW) {
  const out = [];
  String(text).split('\n').forEach(line => {
    let cur = '';
    for (const ch of line) { if (cur && ctx.measureText(cur + ch).width > maxW) { out.push(cur); cur = ch; } else cur += ch; }
    out.push(cur);
  });
  return out;
}
function chipsFor(s) {
  const c = [];
  ['sh', 'nk', 'ym'].forEach(x => s.m.filter(p => p.co === x).forEach(p => c.push({ k: 'p:' + p.name, label: p.name, t: p.name + (p.half ? '（' + p.half + '）' : ''), col: COL[x] })));
  s.m.filter(p => p.co === 'gk').forEach(p => c.push({ k: 'g:' + p.name, label: p.name + '（協力）', t: p.name + ' ×' + (p.n || 1), col: COL.gk }));
  if (!s.kakou) c.forEach(x => { x.chief = x.k === CHIEF[s.name]; });
  c.sort((a, b) => (b.chief ? 1 : 0) - (a.chief ? 1 : 0));   // 職長を先頭に
  return c;
}
function chipW(ctx, c) { return ctx.measureText(c.t).width + 26 + (c.chief ? 26 : 0); }
// チップを描く。職長は金色の枠と、名前の前に丸い印
function drawChip(ctx, c, cx, cy, CH) {
  rr(ctx, cx, cy, c.w, CH, CH / 2); ctx.fillStyle = c.col[0]; ctx.fill();
  let tx = cx + 13;
  if (c.chief) {
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#d99a00'; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 17, cy + CH / 2, 10, 0, Math.PI * 2); ctx.fillStyle = '#d99a00'; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'center'; ctx.fillText(CHIEF_MARK, cx + 17, cy + CH / 2 + 5); ctx.textAlign = 'left';
    tx += 26;
  }
  ctx.fillStyle = c.col[1]; ctx.font = (c.chief ? 'bold ' : '') + '17px ' + FONT; ctx.fillText(c.t, tx, cy + 21);
}
function layoutChips(ctx, chips, maxW) {
  ctx.font = '17px ' + FONT;
  const rows = []; let row = [], x = 0;
  for (const c of chips) {
    const w = chipW(ctx, c);
    if (row.length && x + w > maxW) { rows.push(row); row = []; x = 0; }
    row.push({ ...c, w }); x += w + 7;
  }
  if (row.length) rows.push(row);
  return rows;
}

// 送る日から見て「明日の配置です」「今日の配置です」「月曜日の配置です」
function relLabel(dateStr) {
  const now = new Date(Date.now() + 9 * 3600 * 1000);                     // 日本時間
  const today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
  const [y, m, d] = dateStr.split('-').map(Number);
  const target = Date.UTC(y, m - 1, d);
  const diff = Math.round((target - today) / 86400000);
  if (diff === 0) return '今日の分です';
  if (diff === 1) return '明日の分です';
  if (diff > 1 && diff < 7) return '次の' + '日月火水木金土'[new Date(target).getUTCDay()] + '曜日の分です';
  return '';
}

function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// B案（10/10 決定）：会社の色の見出し帯の下に、その会社の現場を並べる。現場の箱の左に会社の色の線
const GROUP_NAME = { sh: '白石工業の現場', nk: '中嶋板金の現場', ym: '山下板金の現場', other: 'その他の現場', kakou: '加工（工場）' };
const GROUP_COL = { sh: '#1f4f8a', nk: '#1f6b3c', ym: '#8f3329', other: '#5f6c73', kakou: '#555049' };
function drawCard(day) {
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  const PAD = 22, CH = 30, IN = 14;
  const groups = ['sh', 'nk', 'ym', 'other', 'kakou'].map(g => ({ g, ss: day.sites.filter(s => (s.own || (s.kakou ? 'kakou' : 'other')) === g) })).filter(x => x.ss.length);
  const MEMO_FONT = 'bold 16px ' + FONT, ML = 22;   // メモの字と1行の高さ
  const L = groups.map(x => ({ ...x, cards: x.ss.map(s => {
    ctx.font = MEMO_FONT;
    const memo = (MEMO[s.name] || '').trim();
    return { s, rows: layoutChips(ctx, chipsFor(s), W - PAD * 2 - IN * 2), memo: memo ? wrapText(ctx, '※ ' + memo, W - PAD * 2 - IN * 2 - 20) : [] };
  }) }));
  const memoH = r => r.memo.length ? r.memo.length * ML + 14 : 0;
  const cardH = r => 42 + Math.max(1, r.rows.length) * (CH + 6) + memoH(r) + 8;
  const TOP = 104, SUM = 64;
  // 休みも出す（2026-10-14 専務）。赤いセル・有給・休・欠勤の人を、会社の色で一番下に並べる
  const offChips = [];
  ['sh', 'nk', 'ym'].forEach(c => [...new Set(((day.companies || {})[c] || {}).off || [])].forEach(nm => offChips.push({ t: nm, col: COL[c] })));
  (day.offGk || []).forEach(g => offChips.push({ t: g.name + ' ×' + (g.n || 1), col: COL.gk, n: g.n || 1 }));   // 協力会社の休み（2026-10-20）
  const offN = offChips.reduce((k, c) => k + (c.n || 1), 0);
  const offRows = offChips.length ? layoutChips(ctx, offChips, W - PAD * 2 - IN * 2) : [];
  const OFF_H = offRows.length ? 42 + offRows.length * (CH + 6) + 12 : 0;
  const H = TOP + SUM + 8 + L.reduce((a, x) => a + 42 + x.cards.reduce((b, r) => b + cardH(r) + 8, 0) + 12, 0) + OFF_H + 22;
  cv.width = W * S; cv.height = H * S; ctx.scale(S, S);
  cv._H = H; cv._cards = [];
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  // 帯：日付を大きく
  ctx.fillStyle = '#273246'; ctx.fillRect(0, 0, W, TOP);
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 36px ' + FONT; ctx.fillText(day.label + 'の配置です', PAD, 54);
  ctx.font = 'bold 18px ' + FONT; ctx.fillText(relLabel(day.date), PAD, 88);
  // 会社ごとの人数
  // 社員は午前・午後で2つの現場に出ても1人と数える
  const n = x => x === 'gk'
    ? day.sites.reduce((k, s) => k + s.m.filter(p => p.co === 'gk').reduce((a, p) => a + (p.n || 1), 0), 0)
    : new Set(day.sites.flatMap(s => s.m.filter(p => p.co === x).map(p => p.name))).size;
  let x = PAD; ctx.font = 'bold 17px ' + FONT;
  for (const [nm, co] of [['白石工業', 'sh'], ['中嶋板金', 'nk'], ['山下板金', 'ym'], ['協力会社', 'gk']]) {
    const tx = nm + ' ' + n(co) + '名', w = ctx.measureText(tx).width + 28;
    rr(ctx, x, TOP + 18, w, 32, 16); ctx.fillStyle = COL[co][0]; ctx.fill(); ctx.fillStyle = COL[co][1]; ctx.fillText(tx, x + 14, TOP + 40);
    x += w + 8;
  }
  // 会社ごとのまとまり
  let y = TOP + SUM + 8;
  for (const { g, cards } of L) {
    rr(ctx, PAD, y, W - PAD * 2, 34, 8); ctx.fillStyle = GROUP_COL[g]; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 19px ' + FONT; ctx.fillText(GROUP_NAME[g], PAD + 14, y + 24);
    ctx.textAlign = 'right'; ctx.font = '15px ' + FONT; ctx.fillText(cards.length + '現場', W - PAD - 14, y + 23); ctx.textAlign = 'left';
    let yy = y + 42;
    for (const r of cards) {
      const ch = cardH(r);
      rr(ctx, PAD, yy, W - PAD * 2, ch, 8); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = '#dfe5e8'; ctx.stroke();
      ctx.fillStyle = GROUP_COL[g]; ctx.fillRect(PAD, yy + 8, 4, ch - 16);
      ctx.fillStyle = '#1d2830'; ctx.font = 'bold 19px ' + FONT; ctx.fillText(r.s.name, PAD + 16, yy + 29);
      ctx.fillStyle = '#5f6c73'; ctx.font = '16px ' + FONT; ctx.textAlign = 'right'; ctx.fillText(count(r.s) + '名', W - PAD - 14, yy + 29); ctx.textAlign = 'left';
      let cy = yy + 40;
      for (const row of r.rows) {
        let cx = PAD + IN;
        for (const c of row) { drawChip(ctx, c, cx, cy, CH); cx += c.w + 7; }
        cy += CH + 6;
      }
      if (r.memo.length) {   // メモ：黄色い帯に「※ 〜」
        rr(ctx, PAD + IN, cy, W - PAD * 2 - IN * 2, memoH(r) - 6, 6); ctx.fillStyle = '#fff4cc'; ctx.fill();
        ctx.fillStyle = '#7a4a00'; ctx.font = MEMO_FONT;
        r.memo.forEach((ln, i) => ctx.fillText(ln, PAD + IN + 10, cy + 20 + i * ML));
      }
      if (!r.s.kakou) cv._cards.push({ s: r.s, y: yy });   // ［職長 ▾］を重ねる場所
      yy += ch + 8;
    }
    y = yy + 12;
  }
  if (offRows.length) {
    rr(ctx, PAD, y, W - PAD * 2, 34, 8); ctx.fillStyle = '#8a9298'; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 19px ' + FONT; ctx.fillText('休み', PAD + 14, y + 24);
    ctx.textAlign = 'right'; ctx.font = '15px ' + FONT; ctx.fillText(offN + '名', W - PAD - 14, y + 23); ctx.textAlign = 'left';
    let cy = y + 42;
    for (const row of offRows) {
      let cx = PAD + IN;
      for (const c of row) { rr(ctx, cx, cy, c.w, CH, CH / 2); ctx.fillStyle = c.col[0]; ctx.fill(); ctx.fillStyle = c.col[1]; ctx.font = '17px ' + FONT; ctx.fillText(c.t, cx + 13, cy + 21); cx += c.w + 7; }
      cy += CH + 6;
    }
    y = cy + 12;
  }
  ctx.fillStyle = '#5f6c73'; ctx.font = '15px ' + FONT;
  ctx.textAlign = 'right'; ctx.fillText('出典：人員配置表', W - PAD, y);
  return cv;
}
// ===== 送る =====
async function upload(cv, co) {
  const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ k: K, d: D, co, png: cv.toDataURL('image/png') }) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '画像の保存に失敗');
  return j;
}

// 画像の保存は画面を開いたときに先に済ませる。
// ボタンを押してから保存すると時間がかかり、ブラウザが「グループを選ぶ窓」を止めてしまう（EXCEPTION_IN_SUBWINDOW）
function prepare(cv, co, btn, st) {
  btn.disabled = true; st.textContent = '画像を準備しています…';
  const p = upload(cv, co);
  p.then(() => { btn.disabled = false; st.textContent = '準備できました'; })
   .catch(e => { st.textContent = '画像の準備に失敗：' + (e.message || e) + '（画面を読み込み直してください）'; });
  return p;
}

async function send(ready, text, btn, st) {
  let img;
  try { img = await ready; } catch (e) { return; }
  const msgs = [{ type: 'image', originalContentUrl: img.url, previewImageUrl: img.preview }];
  if (text) msgs.push({ type: 'text', text: '【' + labelShort + ' 現場の場所】\n\n' + text });
  try {
    st.textContent = '送り先のグループを選んでください';
    const r = await liff.shareTargetPicker(msgs, { isMultiple: true });
    st.textContent = r ? '送りました（' + new Date().toLocaleTimeString('ja-JP') + '）' : '送るのをやめました';
  } catch (e) {
    st.textContent = '失敗しました：' + (e.code || '') + ' ' + (e.message || e) +
      (e.code === 'EXCEPTION_IN_SUBWINDOW' ? '（もう一度押してください。続くときはポップアップを許可）' : '');
  }
}

// 現場のメモを入れる窓。［決定］で画像と文を作り直す
function openMemo(site, done) {
  const bg = document.createElement('div'); bg.className = 'mdl';
  bg.innerHTML = '<div class="box"><b></b><div class="st">画像のこの現場の下に入ります。空にすると消えます。</div><textarea rows="3" placeholder="例：8:45入場。朝礼あり。ヘルメット白"></textarea><div class="row"><button type="button" class="no">やめる</button><button type="button" class="ok">決定</button></div></div>';
  bg.querySelector('b').textContent = site + ' のメモ';
  const ta = bg.querySelector('textarea'); ta.value = MEMO[site] || '';
  const close = () => bg.remove();
  bg.querySelector('.no').onclick = close;
  bg.onclick = e => { if (e.target === bg) close(); };
  bg.querySelector('.ok').onclick = () => { MEMO[site] = ta.value.trim(); close(); done(); };
  document.body.appendChild(bg); ta.focus();
}

// 日付を選ぶ（初期値＝明日、日曜なら月曜）
function askDate() {
  return new Promise(resolve => {
    const t = new Date(Date.now() + 9 * 3600 * 1000 + 86400000);
    if (t.getUTCDay() === 0) t.setTime(t.getTime() + 86400000);
    const def = t.toISOString().slice(0, 10);
    const box = document.createElement('section');
    const lab = document.createElement('div'); lab.textContent = '送る日の配置を選んでください';
    const inp = document.createElement('input'); inp.type = 'date'; inp.id = 'pick-date'; inp.value = def; inp.style.cssText = 'font-size:18px;padding:6px;max-width:220px';
    const go = document.createElement('button'); go.textContent = 'この日の配置を出す'; go.id = 'pick-go';
    go.onclick = () => { box.remove(); resolve(inp.value); };
    box.append(lab, inp, go);
    document.getElementById('list').appendChild(box);
    bar('日付を選んで［この日の配置を出す］を押してください。');
  });
}

async function main() {
  if (!K) { bar('リンクが正しくありません（人員配置表のメニューか、保存したリンクから開いてください）', true); return; }
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    if (!liff.isApiAvailable('shareTargetPicker')) { bar('この画面ではグループを選んで送れません（LIFFの設定でシェアターゲットピッカーをオンにしてください）', true); }
  } catch (e) { bar('LINEの準備に失敗: ' + e, true); return; }

  if (!D) D = await askDate();
  bar('配置を読み込んでいます…');
  let day;
  try {
    const j = await (await fetch(GAS_URL + '?d=' + encodeURIComponent(D) + '&k=' + encodeURIComponent(K))).json();
    if (!j.ok) throw new Error(j.error);
    day = j.day;
  } catch (e) { bar('配置を読めませんでした: ' + (e.message || e), true); return; }

  document.getElementById('ttl').textContent = day.label + ' の現場配置をLINEに送る';
  labelShort = day.label;
  bar('［送る］を押して、LINEで送り先のグループ（白石・中嶋・山下）を選んでください。まとめて選べます。');
  const ORDER = { sh: 0, nk: 1, ym: 2, other: 3 };
  // 地図リンクの文（メモは画像だけに入れる。文には入れない：2026-10-19 平川さん）
  const makeText = () => day.sites.filter(s => !s.kakou).slice().sort((p, q) => (ORDER[p.own] ?? 3) - (ORDER[q.own] ?? 3)).map(s => '■' + s.name + '\n' + (s.map || '（住所未登録）')).join('\n\n');
  let text = makeText();
  const list = document.getElementById('list');
  const sec = document.createElement('section');
  const two = document.createElement('div'); two.className = 'two';
  // 職長の初めの値＝その現場の先頭の人
  day.sites.filter(s => !s.kakou).forEach(s => { const c = chipsFor(s); if (c.length) CHIEF[s.name] = c[0].k; });
  const wrapCv = document.createElement('div'); wrapCv.className = 'cvwrap';
  const right = document.createElement('div'); right.style.display = 'grid'; right.style.gap = '10px'; right.style.alignContent = 'start';
  const pre = document.createElement('pre'); pre.textContent = '【' + labelShort + ' 現場の場所】\n\n' + (text || '（地図リンクなし）');
  const btn = document.createElement('button'); btn.textContent = '送る（画像＋地図リンク）';
  const st = document.createElement('div'); st.className = 'st';
  let ready;
  // 画像を描いて、各現場の右上に［職長 ▾］を重ねる。職長を変えたら描き直して保存し直す
  const render = () => {
    const cv = drawCard(day);
    wrapCv.innerHTML = ''; wrapCv.appendChild(cv);
    cv._cards.forEach(({ s, y }) => {
      const tools = document.createElement('div'); tools.className = 'tools';
      tools.style.top = (y + 11) / cv._H * 100 + '%';
      const mb = document.createElement('button'); mb.type = 'button'; mb.className = 'memo' + ((MEMO[s.name] || '').trim() ? ' on' : '');
      mb.textContent = (MEMO[s.name] || '').trim() ? '✎メモあり' : '✎メモ';
      mb.onclick = () => openMemo(s.name, () => render());
      tools.appendChild(mb);
      const chips = chipsFor(s);
      if (chips.length) {
        const sel = document.createElement('select'); sel.className = 'chief';
        sel.title = s.name + 'の職長を変える';
        chips.forEach(c => { const o = document.createElement('option'); o.value = c.k; o.textContent = '職長：' + c.label; o.selected = c.chief; sel.appendChild(o); });
        sel.onchange = () => { CHIEF[s.name] = sel.value; render(); };
        tools.appendChild(sel);
      }
      wrapCv.appendChild(tools);
    });
    text = makeText();
    pre.textContent = '【' + labelShort + ' 現場の場所】\n\n' + (text || '（地図リンクなし）');
    ready = prepare(cv, 'all', btn, st);
  };
  render();
  btn.onclick = () => send(ready, text, btn, st);
  right.append(btn, st, pre);
  two.append(wrapCv, right);
  sec.append(two);
  list.appendChild(sec);
}main();
</script>
</body>
</html>
