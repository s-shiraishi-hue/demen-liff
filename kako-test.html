<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="加工管理（テスト）">
<meta property="og:description" content="加工の依頼・状態・やりとり（見本のデータ）">
<!-- 加工管理の LINE テスト用（白石さん 11/25「仮グループで試す」）。中身は見本の絵のデータだけ（本物にはつながっていない・本物の写真は入れない）。
     出面と同じ LIFF「出面報告」の下で開く：https://liff.line.me/2011897591-HBBipfnN/kako-test.html
     グループに貼ったこのリンクから開いたときだけ、やりとりを本人の名前でそのグループに送れる（liff.sendMessages） -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
window.KAKO_IN_LINE=false;
window.KAKO_LIFF=(window.liff?liff.init({liffId:'2011897591-HBBipfnN'}).then(function(){
  var c=liff.getContext()||{};window.KAKO_IN_LINE=liff.isInClient()&&(c.type==='group'||c.type==='room'||c.type==='utou');
  try{var p=liff.isLoggedIn()?liff.getProfile():null;if(p)p.then(function(pr){try{if(!localStorage.getItem('kako-me'))localStorage.setItem('kako-me',pr.displayName);}catch(e){}});}catch(e){}
}).catch(function(){}):Promise.resolve());
</script>
</head><body>
<title>工場長画面 作り直し案1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
/* 工事管理システムの決めごと（DADS もと）にそろえる：灰が基本、青は「今ここ」と「押せるもの」だけ。
   札：灰＝開始前、青＝進行中、緑＝完了、赤＝要確認、黄＝警告。文字は 28/20/16/14px・太さ2つ。
   工場の明るい所で iPad を見る前提で、明るい地に固定（暗い表示にはしない）。押せる所は 56px 以上。 */
:root{
  color-scheme:light;
  --bg:#f1f2f4; --surface:#ffffff; --ink:#1a1a1c; --sub:#4d4f55; --line:#c9ccd2; --line-strong:#8e939b;
  --blue:#0031d8; --blue-bg:#e8f1fe; --blue-ink:#00118f;
  --green:#197a4b; --green-bg:#e6f5ec;
  --gray-tag:#5f6368; --gray-bg:#eceef1;
  --red:#d01c1c; --red-bg:#fdeeee;
  --yellow:#8a5300; --yellow-bg:#fff3c4;
  --skel:#e2e4e8; --skel-hi:#f2f3f5;
  --font:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
  --f1:28px; --f2:20px; --f3:16px; --f4:14px;
}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--f3);line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #000;box-shadow:0 0 0 6px #ffd43d;outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mihon{background:var(--yellow-bg);color:var(--yellow);border:1px solid #e0b84a;border-radius:8px;padding:8px 12px;font-size:var(--f4);margin-bottom:12px}
.mihon b{font-weight:700}

/* 上の帯 */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.top h1{margin:0;font-size:var(--f1);line-height:1.3}
.top .today{color:var(--sub);font-size:var(--f3)}
.top .sp{flex:1}
.btn{min-height:56px;padding:0 20px;border-radius:10px;border:2px solid var(--blue);background:var(--surface);color:var(--blue);font-weight:700;font-size:var(--f3);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--blue);color:#fff}
.btn.quiet{border-color:var(--line-strong);color:var(--ink);font-weight:400}
.btn:disabled{opacity:.45;cursor:default}

/* 状態のタブ */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:10px}
.tab{min-height:64px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;padding:4px}
.tab b{font-size:var(--f2);font-variant-numeric:tabular-nums}
.tab span{font-size:var(--f4)}
.tab[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-ink)}
.tab[aria-pressed="true"] span{font-weight:700}
.find{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:6px}
.find input{min-height:56px;border:2px solid var(--line-strong);border-radius:10px;padding:0 14px;background:var(--surface);font-size:var(--f3);width:100%}
.more{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.more select{min-height:52px;border:2px solid var(--line-strong);border-radius:10px;padding:0 12px;background:var(--surface);flex:1 1 200px;min-width:0}
.status-line{min-height:24px;font-size:var(--f4);color:var(--sub);margin:4px 0 8px}

/* 一覧 */
.group{margin-top:18px}
.group h2{margin:0 0 8px;font-size:var(--f2);display:flex;align-items:center;gap:10px}
.group h2 small{font-size:var(--f4);font-weight:400;color:var(--sub)}
.group.late h2{color:var(--red)}
.cards{display:grid;gap:10px}
@media (min-width:900px) and (orientation:landscape){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* 写真メイン：カードの上半分を写真にして、納期・即日は写真の上に重ねる */
.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:900px) and (orientation:landscape){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{display:grid;grid-template-columns:minmax(0,1fr);gap:0;align-items:start;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden}
.card .thumb{width:100%;border-radius:0;aspect-ratio:4/3}
.card .thumb img{object-fit:cover;object-position:center;background:#fff}
.card .cnt{font-size:var(--f3);padding:2px 10px;right:8px;bottom:8px}
/* カードの上で状態を変える：開く所（写真と文字）と、状態のボタンを分ける */
.card .open{display:block;width:100%;padding:0;border:0;background:none;text-align:left;color:inherit;font:inherit;border-radius:0}
.cact{padding:0 12px 12px;display:grid;gap:8px}
.mini{display:-webkit-flex;display:flex;list-style:none;margin:0;padding:0}
.mini li{-webkit-flex:1 1 0;flex:1 1 0;margin-right:3px;border-top:6px solid var(--line);padding-top:3px;font-size:12px;color:var(--sub);text-align:center;line-height:1.3}
.mini li:last-child{margin-right:0}
.mini li.done{border-top-color:var(--green);color:var(--ink)}
.mini li.now{border-top-color:var(--blue);color:var(--blue-ink);font-weight:700}
.nextb{min-height:60px;width:100%;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:var(--f2);font-weight:700;line-height:1.25;padding:6px 10px}
.nextb small{display:block;font-size:13px;font-weight:400;opacity:.9}
.nextb:disabled{opacity:.5}
.finished{min-height:48px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;border-radius:10px;background:var(--green-bg);color:var(--green);font-weight:700}
.toast button{margin-left:14px;background:#fff;color:#1a1a1c;border:0;border-radius:8px;min-height:40px;padding:0 14px;font-weight:700}
.ov{position:absolute;left:8px;top:8px;display:flex;flex-wrap:wrap;gap:6px;z-index:1}
.ov .due{background:rgba(255,255,255,.95);border-radius:8px;padding:0 10px;border:2px solid var(--line-strong);color:var(--ink)}
.ov .due.late{border-color:var(--red);color:var(--red)}
.card .cbody{padding:10px 12px 12px}
@media (hover:hover){.card:hover{border-color:var(--blue)}}
.card.late{border-color:var(--red)}
.thumb{position:relative;width:132px;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--skel)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb .cnt{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.72);color:#fff;font-size:var(--f4);font-weight:700;border-radius:6px;padding:0 8px}
.thumb .none{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;color:var(--sub);font-size:var(--f4);background:var(--gray-bg)}
.skel{background:linear-gradient(90deg,var(--skel) 0,var(--skel-hi) 50%,var(--skel) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.cbody{min-width:0;display:grid;gap:4px}
.row1{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.due{font-size:var(--f2);font-weight:700;font-variant-numeric:tabular-nums}
.due.late{color:var(--red)}
.site{font-size:var(--f2);font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.who{font-size:var(--f3);color:var(--sub);overflow-wrap:anywhere}
.memo{font-size:var(--f4);color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;font-size:var(--f4);font-weight:700;border:1.5px solid currentColor;white-space:nowrap}
.tag.s0{color:var(--gray-tag);background:var(--gray-bg)}
.tag.s1{color:var(--blue);background:var(--surface)}
.tag.s2{color:#fff;background:var(--blue);border-color:var(--blue)}
.tag.s3{color:var(--green);background:var(--green-bg)}
.tag.rush{color:var(--yellow);background:var(--yellow-bg)}
.tag.late{color:var(--red);background:var(--red-bg)}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--sub)}
@media (max-width:560px){.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* 詳細：いちばん上に大きい写真、その下に小さい写真の列 */
.hero{display:block;width:100%;padding:0;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;position:relative}
.hero .box{aspect-ratio:4/3;background:var(--skel)}
.hero img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
.hero .hint{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.72);color:#fff;border-radius:8px;padding:4px 12px;font-size:var(--f3);font-weight:700}
.strip{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.strip .ph{flex:0 0 120px}
.strip .ph[aria-current="true"]{border-color:var(--blue);background:var(--blue-bg)}

/* 詳細 */
.sheet{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--bg);overflow-y:auto;z-index:5}
.bar{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:2px solid var(--line);padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center}
.bar .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.d-head{display:grid;gap:6px;margin:8px 0 14px}
.d-head h2{margin:0;font-size:var(--f1);line-height:1.3;overflow-wrap:anywhere}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:var(--f2)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-bottom:14px;list-style:none;padding:0}
.steps li{position:relative;text-align:center;font-size:var(--f4);padding:8px 2px 0;border-top:6px solid var(--line);color:var(--sub)}
.steps li.done{border-top-color:var(--green);color:var(--ink)}
.steps li.now{border-top-color:var(--blue);color:var(--blue-ink);font-weight:700}
.steps li.now::before{content:"いまここ";display:block;font-size:12px;color:var(--blue)}
.act{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}
.act .btn{min-height:64px;font-size:var(--f2)}
.act .btn.quiet{font-size:var(--f3)}
.saved{min-height:26px;margin-top:8px;font-size:var(--f3)}
.saved.ok{color:var(--green);font-weight:700}
.saved.ng{color:var(--red);font-weight:700}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:0;margin:0}
.kv dt,.kv dd{padding:10px 0;border-bottom:1px solid var(--line);margin:0}
.kv dt{color:var(--sub);font-size:var(--f4);padding-top:12px}
.kv dd{font-size:var(--f3);overflow-wrap:anywhere;white-space:pre-wrap}
.kv dd.big{font-size:var(--f2);font-weight:700}
.kv dd.big.late{color:var(--red)}
details summary{min-height:56px;display:flex;align-items:center;font-weight:700;cursor:pointer;color:var(--blue)}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (orientation:landscape) and (min-width:900px){.photos{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.photos{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ph{display:grid;gap:4px;text-align:left;border:2px solid var(--line);border-radius:10px;padding:6px;background:var(--surface);min-width:0}
.ph .box{aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--skel)}
.ph img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
.ph span{font-size:var(--f4);overflow-wrap:anywhere}
.pdf{display:flex;align-items:center;gap:10px;min-height:56px;font-size:var(--f3)}
.pdf i{font-style:normal;background:var(--red);color:#fff;border-radius:4px;font-size:12px;font-weight:700;padding:2px 6px}

/* 図面を大きく・書き込み */
.viewer{position:fixed;top:0;right:0;bottom:0;left:0;background:#2b2d31;z-index:20;overflow:auto}
.viewer .bar{background:#fff}
.vbody{padding:12px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
.vbody img,.vbody canvas{display:block;max-width:100%;height:auto;margin:0 auto;background:#fff;border-radius:4px}
.vbody canvas{touch-action:none;user-select:none;-webkit-user-select:none;width:100%}
.tools{position:sticky;top:76px;z-index:7;background:#fff;border-radius:12px;padding:10px;margin-bottom:10px;display:grid;gap:8px}
.tline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tline .lab{font-size:var(--f4);color:var(--sub);width:3.5em;flex:none}
.tb{min-height:52px;min-width:64px;padding:0 12px;border-radius:10px;border:2px solid var(--line-strong);background:#fff;font-size:var(--f3);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tb[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-ink);font-weight:700}
.tb .dot{width:18px;height:18px;border-radius:50%;display:inline-block}
.tb.num{min-width:52px;font-size:var(--f2)}
.nowsel{font-size:var(--f3);font-weight:700;color:var(--blue-ink)}
.drawer{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;display:grid;gap:8px}
.nums{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.vhint{color:#e6e7ea;font-size:var(--f4);text-align:center;margin:6px 0 10px}
.vmsg{color:#fff;font-size:var(--f3);text-align:center;min-height:26px}

/* 確かめの小窓（ページの中に作る） */
.dlg{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.5);z-index:40;display:grid;place-items:center;padding:16px}
.dlg .in{background:#fff;border-radius:14px;padding:20px;max-width:440px;width:100%;display:grid;gap:14px}
.dlg p{margin:0;font-size:var(--f3)}
.dlg .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1a1a1c;color:#fff;padding:12px 20px;border-radius:10px;font-size:var(--f3);z-index:50}
/* 古い iPad（iPadOS 14 以前の Safari）向けのつくろい：横並びの間は gap でなく余白で空ける・縦横比は padding で作る・sticky は -webkit- 付き */
.row1,.ov,.tline,.strip,.more,.top,.bar,.nums{gap:0}
.row1>*,.ov>*,.tline>*,.nums>*,.top>*,.bar>*{margin:0 6px 6px 0}
.strip>*{margin-right:8px}.more>*{margin:0 8px 8px 0}
.tb .dot{margin-right:6px}
.bar,.tools{position:-webkit-sticky;position:sticky}
.wrap,.bar{padding-left:16px;padding-right:16px}
@supports (padding:max(1px,2px)){.wrap,.bar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
@supports not (aspect-ratio:1/1){
  .thumb,.ph .box,.hero .box{height:0;padding-top:75%;position:relative}
  .thumb>img,.ph .box>img,.hero .box>img{position:absolute;top:0;left:0}
}
/* 一覧はいつも2列（白石さん）。grid が使えない古い Safari でも flex で2列にする */
.cards{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:space-between;justify-content:space-between}
.cards>.card{width:49%;margin-bottom:10px}
.tabs{display:-webkit-flex;display:flex}
.tabs>.tab{-webkit-flex:1 1 0;flex:1 1 0;margin-right:6px}.tabs>.tab:last-child{margin-right:0}
@supports (display:grid){
  .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards>.card{width:auto;margin-bottom:0}
  .tabs{display:grid}.tabs>.tab{margin-right:0}
}
.viewbar{display:-webkit-flex;display:flex;-webkit-justify-content:flex-end;justify-content:flex-end;margin-bottom:4px}
.group h2{font-size:var(--f1);padding-bottom:6px;border-bottom:2px solid var(--line)}
.sdot{display:inline-block;width:18px;height:18px;border-radius:5px;margin-right:10px;vertical-align:middle;box-sizing:border-box}
.sdot.s0{background:var(--gray-tag)}.sdot.s1{background:#fff;border:4px solid var(--blue)}.sdot.s2{background:var(--blue)}
.stbtn{width:100%;min-height:60px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;border-radius:10px;border:3px solid var(--gray-tag);background:#fff;padding:0 12px;text-align:left;color:var(--ink)}
.stbtn .lbl{font-size:13px;color:var(--sub);margin-right:10px}
.stbtn b{-webkit-flex:1;flex:1;font-size:var(--f2)}
.stbtn .arr{font-size:var(--f4);font-weight:700;white-space:nowrap}
.stbtn.s1{border-color:var(--blue)}.stbtn.s1 .arr{color:var(--blue)}
.stbtn.s2{border-color:var(--blue);background:var(--blue);color:#fff}.stbtn.s2 .lbl{color:#dfe7ff}
.stbtn.s3{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.stmenu{margin-top:6px;border:2px solid var(--line-strong);border-radius:10px;padding:6px;background:var(--surface)}
.stopt,.stclose{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;width:100%;min-height:56px;border:0;border-radius:8px;background:none;font-size:var(--f2);padding:0 10px;text-align:left;color:var(--ink);margin-bottom:4px}
.stopt small{margin-left:auto;font-size:13px;color:var(--blue-ink)}
.stopt.cur{background:var(--blue-bg);font-weight:700}
.stclose{-webkit-justify-content:center;justify-content:center;font-size:var(--f3);color:var(--sub);border-top:1px solid var(--line);border-radius:0;margin:0}
.sdot.s3{background:var(--green)}
/* 3列の板 */
.wrap{max-width:1200px}
.board{display:-webkit-flex;display:flex;-webkit-align-items:flex-start;align-items:flex-start;margin-top:8px}
.board>.col{-webkit-flex:1 1 0;flex:1 1 0;min-width:0;margin-right:10px}.board>.col:last-child{margin-right:0}
@supports (display:grid){.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.board>.col{margin-right:0}}

/* カードの日付：「依頼 11/23(月)」「納期 11/25(水) ［今日］」を2行でそろえる（どのカードも同じ位置） */
.card .dates{display:block;border:0;margin:0 0 4px;border-radius:0;overflow:visible}

.card .dates dd{display:block!important;font-size:15px!important;font-weight:700;white-space:nowrap;margin:0}
.card .dates>div.late dd{color:var(--red)}
.dbg{display:inline-block;font-size:11px;font-weight:700;line-height:1.5;border-radius:5px;padding:0 5px;margin-left:5px;vertical-align:1px;background:var(--gray-bg);color:var(--ink);border:1px solid var(--line-strong)}
.dbg.today{background:var(--blue);color:#fff;border-color:var(--blue)}.dbg.late{background:var(--red);color:#fff;border-color:var(--red)}
@media (max-width:600px){.worker .col>.card .dates dd{font-size:14px!important}.worker .col>.card .dates dt{-webkit-flex-basis:2.4em;flex-basis:2.4em}}
/* 一覧｜カレンダー の切り替えと、カレンダー */
.vtabs{display:-webkit-flex;display:flex;margin:0 0 8px;border:2px solid var(--blue);border-radius:10px;overflow:hidden;max-width:420px}

.vtabs button[aria-selected="true"]{background:var(--blue);color:#fff}
.viewbar .vsw{margin:0;width:340px;max-width:100%}.viewbar .vsw button{min-height:40px;font-size:15px;white-space:nowrap}
/* 画面の切り替え（［一覧｜カレンダー］［加工管理｜納品済み］）は青をやめて濃い灰色に。青は「加工中」などの状態だけに使う（白石さん 11/26「一覧の青と、加工依頼の青、加工中の青一緒で分かりにくい」） */
.vtabs{border-color:#4d5058!important}
.vtabs button{color:#3a3d44!important;background:#fff}
.vtabs button[aria-selected="true"]{background:#3a3d44!important;color:#fff!important}
.cband{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px}
.cband.late{border-color:var(--red);background:var(--red-bg)}
.cband h3{margin:0 0 6px;font-size:17px}.cband.late h3{color:var(--red)}.cband h3 b{margin-left:6px}
.citems{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.citems .citem{width:auto;max-width:100%;margin:0 6px 6px 0}
.cal{margin-bottom:10px}
.cwk{display:-webkit-flex;display:flex}.cwk span{-webkit-flex:1;flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--sub);padding:2px 0}.cwk .we{color:var(--red)}
.cgrid{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.cday{width:14.2857%;min-height:120px;border:1px solid var(--line);background:var(--surface);padding:4px;margin:-1px 0 0 -1px;min-width:0}
.cday.past{background:var(--gray-bg)}.cday.we{background:#fbfbfc}

.cdh{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;font-size:13px;font-weight:700;margin-bottom:4px;white-space:nowrap}
.cdh b{margin-left:auto;font-size:12px;color:var(--blue-ink)}
.ctd{font-size:11px;background:var(--blue);color:#fff;border-radius:5px;padding:0 4px;margin-left:4px}
.citem{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;width:100%;min-height:36px;margin:0 0 4px;padding:2px 4px;border-radius:8px;border:1.5px solid var(--gray-tag);background:var(--gray-bg);text-align:left;color:var(--ink);font-size:13px;line-height:1.3;overflow:hidden}
.citem.s1{border-color:var(--blue);background:#fff}.citem.s2{border-color:var(--blue);background:var(--blue-bg)}.citem.s3{border-color:var(--green);background:var(--green-bg)}
.cst{-webkit-flex:none;flex:none;width:20px;height:20px;border-radius:5px;background:var(--gray-tag);color:#fff;font-size:12px;font-weight:700;text-align:center;line-height:20px;margin-right:4px}
.citem.s1 .cst{background:#fff;color:var(--blue);border:1.5px solid var(--blue);line-height:17px}.citem.s2 .cst{background:var(--blue)}.citem.s3 .cst{background:var(--green)}
.csite{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;-webkit-flex:1;flex:1}
.cwho{display:none}
.crush{-webkit-flex:none;flex:none;font-size:11px;font-weight:700;background:var(--yellow-bg);color:var(--yellow);border-radius:4px;padding:0 3px;margin-left:3px}
.cnote{font-size:13px;color:var(--sub);margin:4px 0 16px}
@supports (display:grid){.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.cday{width:auto}}

/* 携帯：7列は狭いので、日ごとに縦に並べる（依頼がない日は出さない。今日は必ず出す） */
@media (max-width:600px){

/* 会社のボタンは3つ横1列（同じ幅） */
.frad.eq3{-webkit-flex-wrap:nowrap;flex-wrap:nowrap}

.cst{width:auto!important;min-width:20px;padding:0 4px;white-space:nowrap}

.cnote.top .cst.s1{background:#fff;color:var(--blue);border:1.5px solid var(--blue);line-height:17px}.cnote.top .cst.s2{background:var(--blue)}.cnote.top .cst.s3{background:var(--green)}
.cdue{-webkit-flex:none;flex:none;font-size:11px;font-weight:700;border-radius:4px;padding:0 4px;margin-left:4px;background:var(--blue);color:#fff}.cdue.late{background:var(--red)}
.cband.late{border-color:#e0a23a;background:var(--yellow-bg)}.cband.late h3{color:var(--yellow)}

.cal.month .cday{min-height:108px;cursor:pointer}
.cal.month .cday.other{background:#f6f7f9}.cal.month .cday.other .cdn{color:#a5a9b0}
.cal.month .cday.sel{outline:3px solid #f0b400;outline-offset:-3px;position:relative;z-index:2}
.cdn{font-size:14px;font-weight:700}

.cal.month .citem .cst{height:18px;line-height:18px;font-size:11px;padding:0 3px}
.cmore{display:block;width:100%;border:0;background:none;color:var(--blue-ink);font-size:12px;font-weight:700;text-align:left;padding:0 2px;min-height:22px}
.cdots{display:none}
.cband.csel{border-color:#f0b400}
@media (max-width:600px){

  .cal.month .cday{width:14.2857%;min-height:56px;margin:-1px 0 0 -1px;border-radius:0;border:1px solid var(--line);padding:3px 2px}
  .cal.month .cday.empty:not(.today){display:block}
  .cal.month .cday .citem,.cal.month .cday .cmore,.cal.month .ctd{display:none}
  .cal.month .cdh{-webkit-justify-content:center;justify-content:center;margin:0}

  .cdots{display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin-top:3px}
  .cdots i{width:8px;height:8px;border-radius:50%;margin:1px;background:var(--gray-tag)}
  .cdots i.s1{background:#fff;border:1.5px solid var(--blue)}.cdots i.s2{background:var(--blue)}.cdots i.s3{background:var(--green)}
  .cdots em{font-style:normal;font-size:10px;color:var(--sub)}

}
@supports (display:grid){@media (max-width:600px){.cal.month .cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.cal.month .cday{width:auto}}}
/* 月のマスの中：現場名と名前。状態は左の色の線（文字の札は出さない） */

.cal.month .citem{border-left-width:5px;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.cal.month .citem .csite{font-size:12px}
.cal.month .citem .cwho{display:inline;font-size:11px;color:var(--sub);margin-left:3px}
.cal.month .citem .crush{font-size:10px}
/* 2週間の週の表示（iPad・PC） */
.cweek{display:-webkit-flex;display:flex;-webkit-align-items:stretch;align-items:stretch;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.wcol{-webkit-flex:1 1 0;flex:1 1 0;min-width:0;border-right:1px solid var(--line);padding:4px;min-height:150px}
.wcol:last-child{border-right:0}
.wcol.past{background:var(--gray-bg)}.wcol.we{background:#fbfbfc}
.wcol.today{background:var(--blue-bg);box-shadow:inset 0 0 0 3px var(--blue)}
.wh{display:-webkit-flex;display:flex;-webkit-align-items:baseline;align-items:baseline;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.wd{font-size:13px;font-weight:700;color:var(--sub);margin-right:4px}.wcol.we .wd{color:var(--red)}
.wn{font-size:15px;font-weight:700}
.wcol .ctd{margin-left:auto}
.ctall{display:block;width:100%;text-align:left;margin:0 0 5px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);border-left:5px solid var(--gray-tag);background:#fff;color:var(--ink);line-height:1.3}
.ctall.s1{border-left-color:var(--blue)}.ctall.s2{border-left-color:var(--blue);background:var(--blue-bg)}.ctall.s3{border-left-color:var(--green);background:var(--green-bg)}

/* 携帯の2週間：1日1行 */
.prow-h{font-size:13px;font-weight:700;color:var(--sub);margin:8px 0 4px}
.pweek{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:6px}
.prow{display:-webkit-flex;display:flex;-webkit-align-items:stretch;align-items:stretch;border-bottom:1px solid var(--line);min-height:48px}

.prow.none{min-height:34px}
.prow.past{background:var(--gray-bg)}
.pd{-webkit-flex:0 0 52px;flex:0 0 52px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;border-right:1px solid var(--line);line-height:1.1;padding:4px 0}

.pi .ctall .ts{-webkit-flex:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}

.prow{min-height:44px}.prow.none{min-height:36px}

@supports not (aspect-ratio:1/1){@media (min-width:601px) and (orientation:landscape){.col>.card .thumb{padding-top:40%}}}
/* 月のカレンダーで依頼を押したときの小窓（中身は一覧と同じカード） */
.cpop{position:fixed;top:0;right:0;bottom:0;left:0;z-index:12;background:rgba(0,0,0,.45);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:16px}
.cpin{width:100%;max-width:380px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:14px;padding:8px}
.cpbar{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;margin:0 0 8px;font-size:14px;font-weight:700;color:var(--sub);padding-left:4px}
.cpx{min-height:40px;padding:0 14px;border-radius:8px;border:1.5px solid var(--line-strong);background:#fff;font-size:15px;color:var(--ink)}
.cpin .card{border-width:1.5px}
.cpin .card .thumb{aspect-ratio:4/3}
.cpin .card .cbody{padding:8px 12px}
.cpin .card .site{font-size:18px}.cpin .card .who{font-size:13px}
.cpin .card .cact{padding:0 12px 12px}
.cpin .stbtn{min-height:48px}.cpin .stbtn b{font-size:17px}
.cpin .stopt{min-height:48px;font-size:17px}
/* カレンダーの形の切り替え［週］［月］ */
.ckind{display:-webkit-inline-flex;display:inline-flex;margin-left:12px;border:1.5px solid var(--line-strong);border-radius:8px;overflow:hidden}
.ckind button{min-height:36px;padding:0 12px;border:0;border-right:1px solid var(--line);background:#fff;font-size:14px;color:var(--ink)}
.ckind button:last-child{border-right:0}
.ckind button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:700}
/* 月：マス目。週の数で画面の高さを分ける */
.mcal{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.mwh{display:-webkit-flex;display:flex;border-bottom:1px solid var(--line);background:#f7f8fa}
.mwh span{-webkit-flex:1 1 0;flex:1 1 0;text-align:center;font-size:12px;font-weight:700;color:var(--sub);padding:2px 0}.mwh .we{color:var(--red)}
.mwk{display:-webkit-flex;display:flex;border-bottom:1px solid var(--line)}.mwk:last-child{border-bottom:0}
.mcal.w4 .mwk{min-height:calc((100vh - 226px)/4)}.mcal.w5 .mwk{min-height:calc((100vh - 226px)/5)}.mcal.w6 .mwk{min-height:calc((100vh - 226px)/6)}
.mday{-webkit-flex:1 1 0;flex:1 1 0;min-width:0;border-right:1px solid var(--line);padding:2px 3px 3px}.mday:last-child{border-right:0}
.mday.we{background:#fbfbfc}.mday.past{background:var(--gray-bg)}.mday.other .mdn{color:#a5a9b0}
.mday.today{background:var(--blue-bg);box-shadow:inset 0 0 0 2px var(--blue)}
.mday.opn{box-shadow:inset 0 0 0 2px #f0b400}
.mdh{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:2px}
.mdn{font-size:13px;font-weight:700}.mday.we .mdn{color:var(--red)}
.mitem{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;width:100%;min-height:22px;margin:0 0 2px;padding:0 4px;border-radius:5px;border:1px solid var(--line);border-left:4px solid var(--gray-tag);background:#fff;font-size:12px;line-height:1.25;color:var(--ink);text-align:left}
.mitem.s1{border-left-color:var(--blue)}.mitem.s2{border-left-color:var(--blue);background:var(--blue-bg)}.mitem.s3{border-left-color:var(--green);background:var(--green-bg)}
.ms{-webkit-flex:1;flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw{-webkit-flex:none;flex:none;max-width:4.5em;margin-left:4px;font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mz{-webkit-flex:none;flex:none;width:16px;height:16px;line-height:13px;margin-right:3px;border:1.5px solid #d0342c;border-radius:50%;color:#d0342c;font-size:10px;font-weight:700;text-align:center;background:#fff}
.mitem.s3 .ms,.mitem.s3 .mw{color:#5d6b63}
.mday .cmore{min-height:22px;font-size:12px}
/* 横の週：1日1段。依頼は横に5件まで（同じ幅） */
.hweek{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.hrow{display:-webkit-flex;display:flex;-webkit-align-items:stretch;align-items:stretch;border-bottom:1px solid var(--line);min-height:calc((100vh - 176px)/7)}
.hrow:last-child{border-bottom:0}
.hrow.past{background:var(--gray-bg)}.hrow.today{background:var(--blue-bg);box-shadow:inset 0 0 0 2px var(--blue)}
.hd{-webkit-flex:0 0 64px;flex:0 0 64px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;border-right:1px solid var(--line);line-height:1.15}
.hd .pw{font-size:12px}.hrow.we .pw{color:var(--red)}
.hn{font-size:16px;font-weight:700}
.hd .ctd{margin:2px 0 0}
.hi{-webkit-flex:1;flex:1;min-width:0;padding:5px 0 1px 6px}
.hi .ctall{display:inline-block;vertical-align:top;width:19%;margin:0 1% 4px 0;padding:3px 6px}
.hi .ctall .ts{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi .ctall .tw{font-size:12px}
.hi .ctall .zumi{width:22px;height:22px;font-size:11px;border-width:2px;margin:0 4px 0 0}
.hi .pnone{padding-top:8px}
/* 横の週の写真つき：写真が上、現場名と名前が下 */
.hi .hchip{padding:0 0 3px;overflow:hidden;position:relative}
.hph{display:block;position:relative;height:56px;margin:0 0 3px;overflow:hidden;background:var(--skel)}
.hph img{display:block;width:100%;height:100%;object-fit:cover}
.hnone{display:block;padding-top:18px;text-align:center;font-size:11px;color:var(--sub);background:var(--gray-bg);height:100%}
.hrush{position:absolute;left:3px;top:3px;font-size:11px;font-weight:700;background:var(--yellow-bg);color:var(--yellow);border:1px solid #e0b84a;border-radius:4px;padding:0 4px;line-height:1.5}
.hi .hchip .ts,.hi .hchip .tw{padding:0 6px}
.hi .hchip .zumi{position:absolute;right:4px;top:4px;float:none;margin:0;width:34px;height:34px;font-size:17px;border-width:2.5px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.hrow{min-height:52px}
@media (min-width:601px) and (orientation:portrait){.hph{height:72px}.hrow{min-height:calc((100vh - 176px)/7)}}
/* iPad 縦：曜日の列が細いので、現場名と名前は1行（はみ出しは…） */
@media (min-width:601px) and (orientation:portrait){
  .ctall{padding:3px 5px}
  .ctall .ts{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
  .ctall .tw{font-size:11px}
  .wd{font-size:12px}.wn{font-size:14px}
  /* 月：マスが細いので「現場名」と「名前」を2行に */
  .mitem{display:block;padding:1px 4px}
  .ms,.mw{display:block}.mw{max-width:none;margin:0;font-size:10px;line-height:1.2}
  .mz{float:left;margin-top:1px}
}
/* 携帯の週も写真つきで横に並べる（白石さん 11/25「アイホンの週もアイパッドみたいに写真を横に」）。多い日は指で横に送る */
@media (max-width:600px){
  .pi.pch{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 0 2px 6px}
  .pi.pch .hchip{display:inline-block;vertical-align:top;width:92px;min-height:0;margin:0 6px 3px 0;padding:0 0 2px;white-space:normal;border-left-width:4px;overflow:hidden;position:relative}
  .pi.pch .hph{height:50px;margin:0 0 2px}
  .pi.pch .hchip .ts{display:block;font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
  .pi.pch .hchip .tw{display:block;font-size:10px;line-height:1.3;text-align:left;margin:0;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pi.pch .hchip .zumi{position:absolute;right:3px;top:3px;margin:0!important;width:24px!important;height:24px!important;line-height:20px!important;font-size:12px!important;border-width:2px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .pi.pch .hrush{font-size:10px}
  .pi.pch .pnone{display:inline-block}
}
/* 全員同じ画面（白石さん 11/25）：上の段に［＋ 加工を依頼する］、2段目に［表示 ▼］［納品済みを見る］。［▼ 変える］の中に「依頼を直す・写真を入れ替える」 */
.stopt.sfix{font-size:15px!important;color:var(--blue-ink);border-top:1px solid var(--line);border-radius:0;margin:4px 0 0;padding-top:4px}
@media (min-width:601px){
  .viewbar .reqbtn{min-height:40px!important;font-size:15px!important;margin-right:0}
  .who-bar{float:right;margin:0 0 6px 8px}
  .who-bar label{font-size:13px;margin-right:6px}
  .who-bar select{min-height:38px!important;font-size:14px;padding:0 30px 0 10px}
  .who-bar .btn{min-height:38px;padding:0 12px;font-size:14px;font-weight:400;border-width:1.5px;margin-left:8px}
  #list{clear:both}
}
@media (max-width:600px){.col .stmenu{padding:4px}.col .stopt,.col .stclose{min-height:44px;font-size:16px}.col .stclose{font-size:14px}.col .stopt.sfix{font-size:14px!important}}
@media (max-width:600px){.ptab[aria-selected="true"].s3{border-color:var(--green);background:var(--green-bg);color:var(--green)}}
/* 携帯の一覧：カードの上の［▼ 変える］は出さない（押すと小窓のカードで変える） */
@media (max-width:600px){.board .col>.card .cact{display:none}.board .col>.card{margin-bottom:6px}}
/* 納期を変える小窓 */
.duein .dueh{font-size:18px;font-weight:700;margin:0}
.duein .duesub{font-size:14px;color:var(--sub);margin:0}
.duein .frad button{min-width:72px}
.duein .row .btn{min-height:48px}
/* 携帯の一覧は写真つき2列（白石さん 11/25）：写真が上、日付・現場名・名前が下。押すと小窓のカード */
@media (max-width:600px){
  .board>.col.pon{display:-webkit-flex!important;display:flex!important;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:flex-start;align-items:flex-start}
  .board .col>.card{display:block;width:49%;margin:0 0 8px}
  .board .col>.card>.open{display:block}
  .board .col>.card .thumb{width:100%;min-height:0;height:0!important;padding-top:75%!important;aspect-ratio:auto}
  .board .col>.card .thumb>img{position:absolute;top:0;left:0;width:100%;height:100%}
  .board .col>.card .cbody{padding:5px 7px 7px}
  .board .col>.card .dates dt{-webkit-flex-basis:2.3em!important;flex-basis:2.3em!important;font-size:11px!important}
  .board .col>.card .dates dd{font-size:13px!important}
  .board .col>.card .dbg{font-size:10px;padding:0 3px;margin-left:3px}
  .board .col>.card .site{font-size:14px;line-height:1.3}
  .board .col>.card .who{font-size:11px}
  .board .col>.card .wtag{font-size:11px}
  .board .col>.p.empty,.board .col>.empty{width:100%}
}
/* 小窓の納品日の段 */
.cpdd{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;background:var(--green-bg);border:1.5px solid var(--green);border-radius:10px;padding:6px 6px 6px 12px;margin:0 0 8px;color:var(--green);font-size:15px}
.cpdd b{font-size:17px;margin-left:4px}
.cpddb{min-height:40px;padding:0 12px;border-radius:8px;border:1.5px solid var(--green);background:#fff;color:var(--green);font-size:14px;font-weight:700;white-space:nowrap}
/* 小窓の日付・写真の段（iPad も携帯も同じ） */
.cpin .card{margin-bottom:8px}
.cpdd.due{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-ink)}.cpdd.due .cpddb{border-color:var(--blue);color:var(--blue-ink)}
.cpdd.ph{background:#fff;border-color:var(--line-strong);color:var(--ink)}.cpdd.ph .cpddb{border-color:var(--line-strong);color:var(--ink)}
.cpdd i{font-style:normal;font-size:12px;font-weight:700;background:var(--yellow-bg);color:var(--yellow);border-radius:4px;padding:0 5px;margin-left:6px}
@media (min-width:601px){.cpin{max-width:420px}}
/* やりとり欄 */
.talk{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 8px}
.talkh{margin:0 0 6px;font-size:14px;font-weight:700;color:var(--sub)}
.talkl{max-height:220px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-bottom:6px}
.tlog{margin:0 0 4px;font-size:12px;color:var(--sub);text-align:center}
.tm{max-width:85%;margin:0 0 6px;padding:5px 9px;border-radius:12px 12px 12px 3px;background:var(--gray-bg)}
.tm.me{margin-left:auto;border-radius:12px 12px 3px 12px;background:var(--blue-bg)}
.tmh{margin:0;font-size:11px;color:var(--sub)}.tmh b{color:var(--ink);margin-right:6px}
.tmb{margin:0;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.talki{display:-webkit-flex;display:flex;-webkit-align-items:flex-end;align-items:flex-end}
.talki textarea{-webkit-flex:1;flex:1;min-width:0;min-height:44px;margin:0 6px 0 0;font-size:15px}
.talks{-webkit-flex:none;flex:none;min-height:44px;padding:0 14px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;font-size:15px}
.talks:disabled{opacity:.5}
.talkme{margin-bottom:6px}
.talkline{min-height:36px;font-size:13px;color:var(--sub)}.talkline input{width:18px;height:18px}
.tcnt{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.95);color:var(--blue-ink);border:1px solid var(--blue);border-radius:999px;font-size:12px;font-weight:700;padding:0 7px;line-height:1.6}
.dlg p{white-space:pre-wrap}
/* 加工ID（事務用） */
.kid{font-style:normal;font-size:12px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:5px;padding:0 6px;margin-right:8px;font-variant-numeric:tabular-nums}
/* トーストの［LINE で知らせる］ */
.toast .tline{background:#06c755;color:#fff}
/* 依頼を直したあとの［LINE で知らせる］ */
.rsend.rline{background:#06c755;max-width:720px;margin:0 auto 8px}
/* iPhone（Safari・LINE の中）で日付の欄が枠からはみ出すのを防ぐ（白石さん 11/25「納期変更の小窓が携帯で枠がずれてる」） */
.fin[type="date"]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;min-height:48px;line-height:1.4;text-align:left;background:#fff}
.fin[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0}
.dlg .in{min-width:0;box-sizing:border-box}.dlg .in>*{min-width:0;max-width:100%}
.duein .frad{-webkit-flex-wrap:wrap;flex-wrap:wrap}
/* 納品の知らせの窓 */
.npre{margin:0;padding:8px 10px;background:var(--gray-bg);border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.nsend{background:#06c755!important;border-color:#06c755!important}
.nundo{border:0;background:none;color:var(--sub);font-size:13px;text-decoration:underline;min-height:36px;padding:0}
.talkno{margin:6px 0 2px}
/* iPad：縦の列＝同じ状態だと分かるように、列ごとに薄い色の枠でまとめる（白石さん 11/25「下にギャラリーが並んでいるように見える」「薄い色で統一」） */
@media (min-width:601px){
  .board>.col{padding:6px 6px 0;border-radius:14px;border:2px solid var(--line);background:#f6f7f9}
  .board>.col.c0{background:#eef0f3;border-color:#b9bdc4}
  .board>.col.c1{background:#eef3fd;border-color:#9bb3ea}
  .board>.col.c2{background:#e2eafc;border-color:#5b7fe0}
  .board>.col.c3{background:#e9f6ee;border-color:#8fc8a6}
  .board>.col>.colh{margin:0 0 6px}
  .board>.col>.card{border-color:rgba(0,0,0,.08)}
  .board>.col .empty{background:transparent;border-color:rgba(0,0,0,.15)}
}
/* 新しい依頼をグループに送るときの中身（左寄せ） */
.rgrp{margin-top:8px}.rgrp .npre{text-align:left}
.rgmsg{max-width:720px;margin:0 auto 6px;font-size:12px;color:var(--sub)}
/* ステータスの色（白石さん 11/26「各ステータスがやっぱり判別しにくい」）：依頼案件＝灰色、編集済＝オレンジ、加工中＝青、納品済み＝緑。編集済を青の枠からオレンジに */
:root{--org:#c25400;--org-bd:#e07a10;--org-bg:#fff1e0;--org-ink:#8a3b00}
.tag.s1{color:var(--org-ink)!important;border-color:var(--org-bd)!important;background:var(--org-bg)!important}
.sdot.s1{border-color:var(--org-bd)!important}
.stbtn.s1{border-color:var(--org-bd)!important;background:var(--org-bg)}.stbtn.s1 .arr{color:var(--org)!important}
.colh.s1{border-color:var(--org-bd)!important;background:var(--org-bg)!important;color:var(--org-ink)!important}
.sg.s1[aria-pressed="true"]{border-color:var(--org-bd)!important;color:var(--org-ink)!important;background:var(--org-bg)!important}
.stview.s1{border-color:var(--org-bd)!important;background:var(--org-bg)!important;color:var(--org-ink)!important}
.ptab[aria-selected="true"].s1{border-color:var(--org-bd)!important;color:var(--org-ink)!important;background:var(--org-bg)!important}
.citem.s1{border-color:var(--org-bd)!important;background:var(--org-bg)!important}
.citem.s1 .cst,.cnote.top .cst.s1{background:var(--org-bd)!important;color:#fff!important;border-color:var(--org-bd)!important}
.cdots i.s1{background:var(--org-bd)!important;border-color:var(--org-bd)!important}
.ctall.s1,.mitem.s1{border-left-color:var(--org-bd)!important;background:var(--org-bg)!important}
@media (min-width:601px){.board>.col.c1{background:#fdf3e7!important;border-color:#e9b77a!important}.board>.col.c2{background:#e8effd!important;border-color:#5b7fe0!important}}
/* iPad のカードをぎゅっと（白石さん 11/26「依頼日、納期を同じ行で出すとかぎゅっとして、カードがまとめて見れるように」）：写真を低く、依頼と納期を1行、すき間を小さく */
@media (min-width:601px){
  .board>.col>.card{margin-bottom:6px}
  .col>.card .thumb{aspect-ratio:16/9}
  @supports not (aspect-ratio:1/1){.col>.card .thumb{padding-top:56.25%}}
  .col>.card .cbody{padding:5px 8px 4px;gap:1px}
  .col>.card .dates{display:-webkit-flex!important;display:flex!important;border:0;margin:0;-webkit-flex-wrap:nowrap;flex-wrap:nowrap;white-space:nowrap}
  .col>.card .dates>div{display:block!important;width:auto!important;-webkit-flex:none;flex:none;padding:0 8px 0 0;border:0!important;background:none!important}
  .col>.card .dates dt{display:inline!important;font-size:11px;margin-right:3px}
  .col>.card .dates dd{display:inline!important;font-size:13px}
  .col>.card .dates .dbg{font-size:11px;padding:0 4px;margin-left:3px}
  .col>.card .site{font-size:15px;line-height:1.3}
  .col>.card .who{font-size:12px;line-height:1.3}
  .col>.card .cact{padding:0 8px 6px;gap:4px}
  .col>.card .cact button,.col>.card .cact .btn{min-height:34px!important;font-size:13px!important}
  .col>.card .tcnt,.col>.card .cnt{font-size:11px}
}
/* 上の帯：③［‹ 業務管理］（入口に戻る）と ④練習用のお知らせ（入口の係より 11/26 白石さん「加工③④直して」） */
#kbar{position:fixed;top:0;left:0;right:0;z-index:50;height:34px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;background:#fff8d6;border-bottom:1px solid #e0c96a;padding:0 8px 0 4px;font-size:12px;color:#5a4a00}

<script>
/* ===== サーバーの代わり（見本）。関数名とデータの形は宮本さんの GAS と同じにしてある ===== */
(function(){
  var today=new Date();today.setHours(0,0,0,0);
  function d(n){var x=new Date(today);x.setDate(x.getDate()+n);var m=x.getMonth()+1,dd=x.getDate();return x.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}
  var rows=[
    {id:'K-0001',site:'〇〇邸 新築 屋根',customer:'見本工務店',contact:'見本 担当',due:d(0),destination:'現場直送',status:'依頼案件',memo:'ケラバ水切 L=3000 ×6本。夕方積み',worker:'職人A',method:'LINE',relation:'既存工事',company:'白石工業',category:'加工のみ',rush:true,requestDate:d(-1)},
    {id:'K-0002',site:'△△倉庫 改修 外壁',customer:'見本建設',contact:'',due:d(1),destination:'工場引取',status:'編集済',memo:'役物一式。図面の赤字を確認',worker:'職人B',method:'口頭',relation:'既存工事',company:'中嶋板金',category:'加工のみ',rush:false,requestDate:d(-2)},
    {id:'K-0003',site:'□□アパート 雨樋',customer:'見本ハウス',contact:'',due:d(3),destination:'現場直送',status:'加工中',memo:'',worker:'職人A',method:'LINE',relation:'新規',company:'山下板金工作所',category:'外注',rush:false,requestDate:d(-3)},
    {id:'K-0004',site:'◇◇工場 庇',customer:'見本工務店',contact:'',due:d(-2),destination:'工場引取',status:'編集済',memo:'納期を過ぎている見本',worker:'職人C',method:'電話',relation:'既存工事',company:'白石工業',category:'加工のみ',rush:false,requestDate:d(-6)},
    {id:'K-0005',site:'☆☆ビル 笠木',customer:'見本建設',contact:'',due:d(0),destination:'現場直送',status:'加工中',memo:'笠木 W=300 ×10本',worker:'職人B',method:'LINE',relation:'既存工事',company:'中嶋板金',category:'加工のみ',rush:false,requestDate:d(-1)},
    {id:'K-0006',site:'▽▽邸 リフォーム 水切',customer:'見本ハウス',contact:'',due:d(-1),destination:'工場引取',status:'納品済み',memo:'',worker:'職人C',method:'口頭',relation:'既存工事',company:'白石工業',category:'加工のみ',rush:false,requestDate:d(-4)}
  ];
  var nfiles={'K-0001':4,'K-0002':2,'K-0003':1,'K-0004':3,'K-0005':2,'K-0006':0};
  /* 社内用の Web 版だけ：本物の加工依頼の写真を仮に入れたデータ（window.REAL_DATA）があれば、それを使う */
  var R=window.REAL_DATA;
  if(R){rows=R.rows.map(function(r){var o=Object.assign({},r);o.due=r.dueFixed||(r.dueOffset===null||r.dueOffset===undefined?'':d(r.dueOffset));o.requestDate=r.requestDateFixed||d(r.requestOffset||-1);if(r.deliveredAtFixed)o.deliveredAt=r.deliveredAtFixed;return o;});nfiles={};rows.forEach(function(r){nfiles[r.id]=(R.photos[r.id]||[]).length;});
    /* 見本：1日の納期は多くて5件まで（多い日は次の日へずらす。白石さん 11/25） */
    var perDay={};rows.forEach(function(r){if(!r.due)return;var x=r.due;while((perDay[x]||0)>=5){var xp=x.split('-'),nd=new Date(+xp[0],+xp[1]-1,+xp[2]+1),nm=nd.getMonth()+1,ndd=nd.getDate();x=nd.getFullYear()+'-'+(nm<10?'0':'')+nm+'-'+(ndd<10?'0':'')+ndd;}perDay[x]=(perDay[x]||0)+1;r.due=x;});}
  if(!R)for(var k=1;k<=18;k++){var kid='K-09'+(k<10?'0':'')+k;rows.push({id:kid,site:'（見本）納品済み '+k,customer:'',contact:'',due:d(-k),destination:'工場引取',status:'納品済み',memo:'',worker:['職人A','職人B','職人C'][k%3],method:'LINE',relation:'既存工事',company:'白石工業',category:'加工のみ',rush:false,requestDate:d(-k-2),deliveredAt:d(-Math.ceil(k/2))});nfiles[kid]=1;}
  rows.forEach(function(r){if(r.status==='納品済み'&&!r.deliveredAt)r.deliveredAt=r.due||d(0);});
  var extra={},gone={},seq=200;
  /* やりとり（見本）：宮本さん版にはまだない。依頼ごとに {at, by, text, kind}。kind＝msg（書いたこと）／log（変えた記録） */
  var talk={};
  function hhmm(){var x=new Date(),mi=x.getMinutes();return (x.getMonth()+1)+'/'+x.getDate()+' '+x.getHours()+':'+(mi<10?'0':'')+mi;}
  function md2(s){return s?(+s.slice(5,7))+'/'+(+s.slice(8,10)):'なし';}
  function logT(id,by,text,kind){(talk[id]=talk[id]||[]).push({at:hhmm(),by:by||'',text:text,kind:kind||'log'});}
  (function(){var a=rows.filter(function(r){return r.status==='編集済';})[0],b=rows.filter(function(r){return r.status==='加工中';})[0];
    if(a){talk[a.id]=[{at:'11/24 8:10',by:a.worker,text:'依頼を出した',kind:'log'},{at:'11/24 8:12',by:a.worker,text:'長さは全部3000でお願いします',kind:'msg'},{at:'11/24 9:30',by:'工場長',text:'了解。色はいつもの黒でいいですか？',kind:'msg'},{at:'11/24 9:41',by:a.worker,text:'黒でOKです',kind:'msg'},{at:'11/24 10:02',by:'工場長',text:'状態を「編集済」に変更',kind:'log'}];}
    if(b){talk[b.id]=[{at:'11/24 13:20',by:'工場長',text:'状態を「加工中」に変更',kind:'log'},{at:'11/24 13:25',by:'工場長',text:'明日の朝には上がります',kind:'msg'}];}})();
  function img(id,i,w,h){if(extra[id]&&extra[id][i])return extra[id][i];if(R&&R.photos[id]&&R.photos[id][i])return R.photos[id][i];var c=document.createElement('canvas');c.width=w;c.height=h;var g=c.getContext('2d');g.fillStyle='#fbfaf6';g.fillRect(0,0,w,h);g.strokeStyle='#222';g.lineWidth=Math.max(2,w/220);
    g.strokeRect(w*.12,h*.22,w*.76,h*.46);g.beginPath();g.moveTo(w*.12,h*.22);g.lineTo(w*.3,h*.1);g.lineTo(w*.88,h*.1);g.lineTo(w*.88,h*.22);g.stroke();
    g.fillStyle='#222';g.font='bold '+Math.round(w/15)+'px sans-serif';g.fillText(id+' 図面'+(i+1),w*.12,h*.86);g.font=Math.round(w/24)+'px sans-serif';g.fillText('L=3000',w*.42,h*.48);
    return c.toDataURL('image/jpeg',.85).split(',')[1];}
  function files(id){var n=nfiles[id]||0,out=[];for(var i=0;i<n;i++)if(!(gone[id]&&gone[id][id+'-f'+i]))out.push({id:id+'-f'+i,name:'図面_'+(i+1)+'.jpg',mime:'image/jpeg',version:'v1'});if(id==='K-0002')out.push({id:id+'-pdf',name:'加工図.pdf',mime:'application/pdf',version:'v1'});return out;}
  function wait(){return 400+Math.random()*800;}
  var api={
    shiraishiListManagerRequests:function(){return rows.map(function(r){return Object.assign({},r,{imageCount:files(r.id).filter(function(x){return x.mime.indexOf('image/')===0;}).length,talkCount:(talk[r.id]||[]).filter(function(t){return t.kind==='msg';}).length});});},
    /* やりとりを読む・書く（見本）：宮本さん版にはまだない関数 */
    shiraishiListRequestTalk:function(id){return {items:(talk[id]||[]).slice()};},
    shiraishiAddRequestTalk:function(p){if(!p||!p.text)throw new Error('書いてください');logT(p.caseId,p.by,String(p.text).slice(0,500),'msg');return {saved:true};},
    /* 職人さんの依頼（見本）：宮本さんの shiraishiRegisterWorkerRequest と同じ項目を受け取り、K-番号を返す */
    shiraishiRegisterWorkerRequest:function(p){['company','worker','requestDate','customer','site','category','method','due','memo'].forEach(function(k){if(!p[k])throw new Error('必須項目を入力してください：'+k);});
      var id='K-0'+(++seq);rows.push({id:id,constructionId:'',site:p.site,customer:p.customer,contact:p.contact||'',due:p.due,destination:p.destination||'',status:'依頼案件',memo:p.memo,worker:p.worker,method:p.method,relation:p.relation,company:p.company,category:p.category,rush:!!p.rush,requestDate:p.requestDate});nfiles[id]=0;return {id:id};},
    /* 依頼を直す（見本）：宮本さん版にはまだない関数。納品済みになるまではだれでも直せる（白石さん 11/25：全員同じ操作。携帯から写真も入れ替えたい） */
    shiraishiUpdateWorkerRequest:function(p){var r=rows.filter(function(x){return x.id===p.caseId;})[0];if(!r)throw new Error('依頼が見つかりません');if(r.status==='納品済み')throw new Error('納品済みの依頼は直せません。LINEで工場に伝えてください。');
      ['site','customer','contact','due','destination','memo','worker','method','company','category','requestDate'].forEach(function(k){if(p[k]!==undefined)r[k]=p[k];});r.rush=!!p.rush;return {id:r.id};},
    shiraishiSaveWorkerAttachment:function(p){var n=nfiles[p.caseId]||0;(extra[p.caseId]=extra[p.caseId]||[])[n]=p.data;nfiles[p.caseId]=n+1;return {saved:true};},
    /* 写真を外す（見本）：宮本さん版にはまだない関数。納品済みになるまで。ファイルは消さず、依頼から外すだけにする想定 */
    shiraishiRemoveWorkerAttachment:function(p){var r=rows.filter(function(x){return x.id===p.caseId;})[0];if(!r)throw new Error('依頼が見つかりません');if(r.status==='納品済み')throw new Error('納品済みの依頼は写真を変えられません。LINEで工場に伝えてください。');(gone[p.caseId]=gone[p.caseId]||{})[p.fileId]=true;return {removed:true};},
    /* 納期を変える（見本）：宮本さん版にはまだない関数。だれが変えたか（by）も受け取る */
    shiraishiUpdateManagerDue:function(p){var r=rows.filter(function(x){return x.id===p.caseId;})[0];if(!r)throw new Error('依頼が見つかりません');r.due=p.due||'';r.rush=!!p.rush;logT(r.id,p.by,'納期を '+md2(r.due)+(r.rush?'（即日）':'')+' に変更');return {id:r.id,due:r.due,rush:r.rush};},
    /* 納品日を直す（見本）：宮本さん版にはまだない関数（納品した日を残す列も要る）。by つき */
    shiraishiUpdateDeliveredDate:function(p){var r=rows.filter(function(x){return x.id===p.caseId;})[0];if(!r)throw new Error('依頼が見つかりません');if(r.status!=='納品済み')throw new Error('納品済みの依頼だけ直せます');r.deliveredAt=p.deliveredAt||'';logT(r.id,p.by,'納品日を '+md2(r.deliveredAt)+' に変更');return {id:r.id,deliveredAt:r.deliveredAt};},
    shiraishiUpdateManagerStatus:function(p){logT(p.caseId,p.by,'状態を「'+p.status+'」に変更');rows.forEach(function(r){if(r.id===p.caseId){r.status=p.status;r.deliveredAt=p.status==='納品済み'?d(0):'';}});return {id:p.caseId,status:p.status};},
    shiraishiListManagerDetailPhotos:function(id){return {files:files(id)};},
    shiraishiThumbnailManagerCardPhoto:function(p){var i=Number(p.fileId.split('-f')[1]);return {available:true,mime:'image/jpeg',version:'v1',data:img(p.caseId,i,400,300)};},
    shiraishiReadManagerAttachment:function(p){var i=Number(p.fileId.split('-f')[1]);return {mime:'image/jpeg',data:img(p.caseId,i,1600,1200)};}
  };
  window.rpc=function(name,arg){return new Promise(function(ok,ng){setTimeout(function(){try{ok(api[name](arg));}catch(e){ng(e);}},name.indexOf('Thumbnail')>=0||name.indexOf('Read')>=0?wait():250);});};
})();

/* ===== 画面 ===== */
(function(){
  'use strict';
  /* 職人さん用（見るだけ）：状態は札で見るだけ・写真は大きく見るだけ（書き込みなし）・自分の名前で絞れる */
  /* 全員同じ画面・同じ操作（白石さん 11/25「iPhone と iPad はほとんど同じ仕様。同じにして端末で表示を変えるだけ」
     「工場長が iPad がなくても操作できる」「工場長の間違いも気づけば誰かが直せる」）。並べ方だけ画面の幅で変える。
     ?screen=worker で開いても同じ画面。職人さんは Google のアカウントがないので、だれが変えたかは端末で選んだ名前（kako-me）を送る。
     WORKER は前の「見るだけ」の作りに戻すときのために残してある（false 固定） */
  /* 段階のスイッチ（白石さん 11/25「一気に変えると使う方が混乱する」「基本のやりとりはグループのほうが安全」）：
     PHONE_EDIT＝携帯から直せるか（いまは false：携帯は見る＋依頼を出すだけ。直してほしいことは LINE のグループへ。工場長が iPad で直す）
     LINE_NOTICE_ALL＝LINE への知らせ（いまは false：納品済みにしたときだけ。true にすると納期・写真・やりとりも送れる） */

  function byDue(a,b){return (a.due||'9999').localeCompare(b.due||'9999')||(b.rush-a.rush)||a.id.localeCompare(b.id);}
  function setView(v){view=v;render();window.scrollTo(0,0);}
  function mine(){return rows.filter(function(r){return !me||r.worker===me;});}

    if($('goMain'))$('goMain').onclick=function(){if(isDone)setView('main');};if($('goDone'))$('goDone').onclick=function(){if(!isDone)setView('done');};

    var html;

  /* 写真：一覧は1枚目だけ。全部まとめて同時に頼み、来たものから出す（宮本さん版は2枚ずつ順番） */

      var id=box.getAttribute('data-thumb'),r=rows.filter(function(x){return x.id===id;})[0];if(!r||!r.imageCount)return;

      function put(data){box.classList.remove('skel');box.insertAdjacentHTML('afterbegin','<img alt="" src="data:image/jpeg;base64,'+data+'">');}
      if(thumbCache[key]){put(thumbCache[key]);return;}
      rpc('shiraishiThumbnailManagerCardPhoto',{caseId:id,fileId:key}).then(function(res){thumbCache[key]=res.data;if(document.body.contains(box))put(res.data);},function(){box.classList.remove('skel');box.insertAdjacentHTML('afterbegin','<span class="none">写真を出せません</span>');});

  /* 一覧は自動で読み直す：1分ごと（画面が見えていて、依頼を開いていないとき）・iPad の画面に戻ったとき・一覧へ戻ったとき */
  var loading=false,first=true;
  function hm(){var x=new Date(),m=x.getMinutes();return x.getHours()+':'+(m<10?'0':'')+m;}

    var before={};rows.forEach(function(r){before[r.id]=1;});
    return rpc('shiraishiListManagerRequests').then(function(d){
      var added=first?0:d.filter(function(r){return !before[r.id];}).length;rows=d;first=false;
      if($('detail').hidden)render();
      $('updated').textContent=hm()+' に更新（1分ごとに自動）';
      if(added)toast('新しい依頼が'+added+'件来ました');
      say(rows.length+'件の依頼を読み込みました');
    }).catch(function(e){$('updated').textContent=hm()+' は読み込めませんでした。1分後にもう一度読みます';if(first)$('line').textContent='読み込めませんでした。少し待つと、もう一度読みます。';}).then(function(){loading=false;});}

      return offs.reduce(function(p,ph){return p.then(function(){$('rqSend').textContent='写真を外しています…';return rpc('shiraishiRemoveWorkerAttachment',{caseId:id,fileId:ph.id});});},Promise.resolve()).then(function(){return list.reduce(function(p,ph){return p.then(function(){$('rqSend').textContent='写真を送っています… '+(++n)+' / '+list.length;return rpc('shiraishiSaveWorkerAttachment',{caseId:id,name:ph.name,mime:'image/jpeg',data:ph.data}).then(function(x){if(x&&x.url)urls.push(x.url);});});},Promise.resolve());}).then(function(){return {id:id,urls:urls};});
    }).then(function(o){busy=false;done(o.id,input,o.urls);},function(e){busy=false;$('rqSend').disabled=false;$('rqSend').textContent=editing?'もう一度直して送る':'もう一度送る';$('rqErr').textContent='送れませんでした。電波のよい所で、もう一度押してください。（'+(e&&e.message||'')+'）';});
  }
  /* 送ったあと：見出し、送った内容の一覧、［続けて依頼する］［一覧に戻る］（出面フォームの完了画面と同じ形） */
  function done(id,input,urls){var box=$('rqBox');if(!box)return;urls=urls||[];
    $('rqBody').innerHTML='<div class="fwrap rdone"><p class="rok">'+(editing?'直しました':'受け付けました')+'</p><p class="rid">'+esc(id||'')+'</p><dl class="kv2"><dt>会社</dt><dd>'+esc(input.company)+'</dd><dt>名前</dt><dd>'+esc(input.worker)+'</dd><dt>現場</dt><dd>'+esc(input.site)+'</dd><dt>元請</dt><dd>'+esc(input.customer)+'</dd><dt>納期</dt><dd>'+esc(input.due)+(input.rush?'（即日）':'')+'</dd><dt>写真</dt><dd>'+(editing?'外した写真 '+oldPh.filter(function(p){return p.off;}).length+'枚、足した写真 '+photos.length+'枚':photos.length+'枚')+'</dd></dl><p class="rhelp">工場で確認して加工が終わると、一覧の「加工済み」に移ります。</p></div>';
    /* 写真を足した・外したときは［LINE で知らせる］を出す（白石さん 11/25「写真の追加も通知を飛ばしたい」） */
    var nAdd=photos.length,nOff=editing?oldPh.filter(function(p){return p.off;}).length:0,phMsg=editing&&(nAdd||nOff)?'写真を'+(nAdd?nAdd+'枚追加':'')+(nAdd&&nOff?'・':'')+(nOff?nOff+'枚外した':''):'';
    box.querySelector('.rqfoot').innerHTML=(phMsg&&window.kakoLine&&window.KAKO_LINE_ALL?'<button class="rsend rline" type="button" id="rqLine">LINE で知らせる（'+esc(phMsg)+'）</button>':'')+'<div class="rdbtn"><button class="btn quiet" type="button" id="rqAgain">続けて依頼する</button><button class="rsend" type="button" id="rqEnd">一覧に戻る</button></div>';
    if($('rqLine'))$('rqLine').onclick=function(){window.kakoLine({id:id,site:input.site,worker:input.worker},phMsg);this.disabled=true;this.textContent='LINE に送りました';};
    /* 新しい依頼は、グループにも返す（白石さん 11/25「携帯の加工を依頼するも戻してほしい。グループで開くから」）。
       写真のアドレスが返ってきたら写真つきのカード、なければ文だけ */
    if(!editing&&window.kakoLineCard){
      var dd=input.due?(+input.due.slice(5,7))+'/'+(+input.due.slice(8,10)):'なし';
      var content='新しい依頼（納期 '+dd+(input.rush?'・即日':'')+'）'+(input.memo&&input.memo!=='写真のとおり'?'\n'+input.memo:'');
      var rr={id:id,site:input.site,worker:input.worker};
      $('rqBody').insertAdjacentHTML('beforeend','<div class="fwrap rdone rgrp"><p class="rhelp">この内容でグループに送れます'+(urls.length?'（写真 '+urls.length+'枚つき）':'')+'</p><pre class="npre">'+esc(window.kakoLineText(rr,content))+'</pre></div>');
      var f=box.querySelector('.rqfoot');f.insertAdjacentHTML('afterbegin','<button class="rsend rline" type="button" id="rqGrp">グループに送る</button>');
      f.insertAdjacentHTML('afterbegin','<p class="rhelp rgmsg" id="rqGrpMsg"></p>');
      $('rqGrp').onclick=function(){var b=this;b.disabled=true;var m=$('rqGrpMsg');var show=function(){if(m&&window.kakoSendDiag)m.textContent=(window.KAKO_LAST_SEND||'')+'（'+window.kakoSendDiag()+'）';};
        window.kakoLineCard(rr,content,urls).then(function(){show();b.textContent=/送りました/.test(window.KAKO_LAST_SEND||'')?'グループに送りました':'もう一度送る';b.disabled=!/送りました/.test(window.KAKO_LAST_SEND||'');},function(e){show();b.disabled=false;});setTimeout(show,1500);};
    }
    $('rqAgain').onclick=function(){box.remove();window.openRequestForm();};$('rqEnd').onclick=function(){box.remove();};
    K.load();
  }
})();

/* アドレスの指定で開く（白石さん 11/26「加工管理と加工依頼は別々に」。携帯の入口から）：?open=request で依頼フォームをすぐ開く。
   Apps Script では google.script.url で、GitHub（LIFF）では LINE の準備が済んでから読む */
(function(){
  function go(p){p=p||{};if(p.open==='request'&&window.openRequestForm)setTimeout(function(){window.openRequestForm();},400);}
  try{if(window.google&&google.script&&google.script.url&&google.script.url.getLocation){google.script.url.getLocation(function(l){go(l&&l.parameter);});return;}}catch(e){}
  function q(){var o={};(location.search||'').replace(/^[?]/,'').split('&').forEach(function(kv){if(!kv)return;var j=kv.indexOf('=');try{o[decodeURIComponent(j<0?kv:kv.slice(0,j))]=decodeURIComponent(j<0?'':kv.slice(j+1));}catch(e){}});return o;}
  if(window.KAKO_LIFF&&window.KAKO_LIFF.then)window.KAKO_LIFF.then(function(){go(q());},function(){go(q());});else go(q());
})();

/* 上の帯（入口の係より 11/26 白石さん「加工③④直して」）
   ③［‹ 業務管理］：入口（携帯）からは別の窓で開いているので、まず閉じる。閉じられなければ入口のページを開く（ホーム画面のアプリの中で行き止まりにしない）
   ④練習用のお知らせ：本番では KAKO_PRACTICE を false にするだけで消える */
(function(){
  var KAKO_PRACTICE=true;
  var IRIGUCHI='https://s-shiraishi-hue.github.io/demen-liff/iriguchi-test.html';
  var b=document.createElement('div');b.id='kbar';if(!KAKO_PRACTICE)b.className='nop';
  b.innerHTML='<button type="button" class="kback" id="kBack">‹ 業務管理</button>'+(KAKO_PRACTICE?'<span class="kprac">練習用：ここで受け付けた依頼は保存されません（LINE には本当に送られます）</span>':'');
  document.body.insertBefore(b,document.body.firstChild);document.body.className+=' haskbar';
  document.getElementById('kBack').onclick=function(){
    try{window.close();}catch(e){}
    setTimeout(function(){if(!window.closed){try{window.top.location.href=IRIGUCHI;}catch(e){location.href=IRIGUCHI;}}},300);
  };
})();
</script>
