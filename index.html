<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出面LIFFテスト</title>
<style>
  body{margin:0;padding:24px 16px;font-family:sans-serif;background:#f7f6f3;color:#1a1a18}
  h1{font-size:22px;margin:0 0 16px}
  .box{background:#fff;border:1.5px solid #e0ddd6;border-radius:12px;padding:14px;margin-bottom:14px;font-size:14px;line-height:1.7;word-break:break-all}
  button{width:100%;padding:16px;border:none;border-radius:12px;background:#1E7B45;color:#fff;font-size:16px;margin-bottom:10px}
  button:disabled{opacity:.5}
  #log{white-space:pre-wrap;font-size:13px}
</style>
</head>
<body>
<h1>出面 LIFFテスト1</h1>
<div class="box" id="state">準備中…</div>
<button id="btn" disabled onclick="sendTest()">このトークにテスト送信（文＋写真1枚）</button>
<button class="multi" disabled onclick="sendPhotos(4)">文＋写真4枚（1回で送る）</button>
<button class="multi" disabled onclick="sendPhotos(10)">文＋写真10枚（3回に分けて送る）</button>
<button class="multi" disabled onclick="sendCard(10)">まとめカード：写真10枚</button>
<button class="multi" disabled onclick="sendCard(30)">まとめカード：写真30枚（横スクロール）</button>
<div class="box" id="log"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ★LINE Developers で LIFF アプリを作ったら、その LIFF ID をここに入れる
const LIFF_ID = '2011897591-HBBipfnN';

const $ = id => document.getElementById(id);
const log = t => { $('log').textContent += t + '\n'; };
const here = location.href.replace(/[?#].*$/, '').replace(/index\.html$/, '');

async function main() {
  if (!LIFF_ID) { $('state').textContent = 'LIFF_ID が未設定です'; return; }
  try {
    await liff.init({ liffId: LIFF_ID });
  } catch (e) { $('state').textContent = 'liff.init 失敗: ' + e; return; }
  const ctx = liff.getContext() || {};
  const inClient = liff.isInClient();
  const can = liff.isApiAvailable && liff.isApiAvailable('shareTargetPicker');
  let name = '';
  try { name = (await liff.getProfile()).displayName; } catch (e) { name = '(取得できず)'; }
  $('state').innerHTML =
    'LINEの中で開いている: <b>' + (inClient ? 'はい' : 'いいえ') + '</b><br>' +
    '開いた場所: <b>' + (ctx.type || '不明') + '</b>（group=グループ / utou=1対1）<br>' +
    'あなた: <b>' + name + '</b><br>' +
    'shareTargetPicker: ' + (can ? '使える' : '使えない');
  const ok = inClient && ['group', 'room', 'utou'].includes(ctx.type);
  $('btn').disabled = !ok;
  document.querySelectorAll('.multi').forEach(b => b.disabled = !ok);
  if (!ok) log('グループのトーク画面に貼ったリンクから開いてください');
}

// 文1つ＋写真n枚。1回の送信は5つまでなので、文＋4枚 → 5枚ずつ に分けて送る
async function sendPhotos(n) {
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  const imgs = [];
  for (let i = 1; i <= n; i++) {
    const u = here + 'photo' + String(i).padStart(2, '0') + '.jpg';
    imgs.push({ type: 'image', originalContentUrl: u, previewImageUrl: u });
  }
  const text = { type: 'text', text: '【出面テスト】写真' + n + '枚 ' + new Date().toLocaleString('ja-JP') };
  const batches = [[text, ...imgs.slice(0, 4)]];
  for (let i = 4; i < imgs.length; i += 5) batches.push(imgs.slice(i, i + 5));
  try {
    for (let i = 0; i < batches.length; i++) {
      await liff.sendMessages(batches[i]);
      log((i + 1) + '/' + batches.length + '回目 送信OK');
    }
    log('全部送りました。トークを見てください');
  } catch (e) {
    log('送信失敗: ' + (e.code || '') + ' ' + (e.message || e));
  }
  document.querySelectorAll('button').forEach(b => b.disabled = false);
}

async function sendTest() {
  $('btn').disabled = true;
  const img = here + 'sample.jpg';
  try {
    await liff.sendMessages([
      { type: 'text', text: '【出面テスト】' + new Date().toLocaleString('ja-JP') + '\nLIFFから本人として送信しています' },
      { type: 'image', originalContentUrl: img, previewImageUrl: img }
    ]);
    log('送信OK。トークを見てください');
  } catch (e) {
    log('送信失敗: ' + (e.code || '') + ' ' + (e.message || e));
    $('btn').disabled = false;
  }
}
// 1通のカード（Flex）に、報告の文字＋写真タイル（3列）。12枚ごとにカードを分け、2枚以上なら横スクロール
async function sendCard(n) {
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  const urls = [];
  for (let i = 1; i <= n; i++) urls.push(here + 'photo' + String(((i - 1) % 10) + 1).padStart(2, '0') + '.jpg');
  const kv = (k, v) => ({ type: 'box', layout: 'baseline', spacing: 'sm', contents: [
    { type: 'text', text: k, size: 'sm', color: '#8C959F', flex: 2 },
    { type: 'text', text: v, size: 'sm', color: '#1F2429', flex: 6, wrap: true } ] });
  const tile = u => ({ type: 'image', url: u, size: 'full', aspectRatio: '1:1', aspectMode: 'cover', flex: 1,
    action: { type: 'uri', uri: u } });
  const grid = list => {
    const rows = [];
    for (let i = 0; i < list.length; i += 3) {
      const row = list.slice(i, i + 3).map(tile);
      while (row.length < 3) row.push({ type: 'filler' });
      rows.push({ type: 'box', layout: 'horizontal', spacing: 'xs', contents: row });
    }
    return { type: 'box', layout: 'vertical', spacing: 'xs', contents: rows };
  };
  const PER = 12, pages = [];
  for (let i = 0; i < urls.length; i += PER) pages.push(urls.slice(i, i + PER));
  const bubbles = pages.map((list, p) => ({
    type: 'bubble', size: 'giga',
    header: p === 0 ? { type: 'box', layout: 'vertical', backgroundColor: '#1E7B45', paddingAll: '12px', contents: [
      { type: 'text', text: '出面報告 10/6（月）', size: 'sm', color: '#DFF3E6' },
      { type: 'text', text: '126007-00 高田屋箱崎', size: 'lg', weight: 'bold', color: '#FFFFFF', wrap: true } ] }
      : { type: 'box', layout: 'vertical', backgroundColor: '#1E7B45', paddingAll: '12px', contents: [
      { type: 'text', text: '写真 ' + (p * PER + 1) + '〜' + (p * PER + list.length) + ' / ' + n + '枚', size: 'sm', color: '#FFFFFF' } ] },
    body: { type: 'box', layout: 'vertical', spacing: 'md', paddingAll: '12px', contents:
      (p === 0 ? [kv('報告', '永渕'), kv('自社', '永渕・座木・三川（3人役）'), kv('協力', '葛西組×1'),
        kv('車', '2台／ユニック 0台'), kv('写真', n + '枚（施工）'), { type: 'separator' }] : []).concat([grid(list)]) }
  }));
  const contents = bubbles.length === 1 ? bubbles[0] : { type: 'carousel', contents: bubbles };
  try {
    await liff.sendMessages([{ type: 'flex', altText: '【出面】10/6 高田屋箱崎 写真' + n + '枚', contents: contents }]);
    log('カードを送りました。トークを見てください');
  } catch (e) {
    log('送信失敗: ' + (e.code || '') + ' ' + (e.message || e));
  }
  document.querySelectorAll('button').forEach(b => b.disabled = false);
}
main();
</script>
</body>
</html>
